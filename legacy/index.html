[B('رویداد، هشدار و رخداد یکی نیستند','Events, alerts and incidents differ'),B('رویداد یک مشاهده در لاگ است. هشدار خروجی یک قانون تشخیص است؛ الزاماً حمله نیست. رخداد امنیتی پس از ارزیابی شواهد و طبق تعریف سازمان تعیین می‌شود. Tier 1 هویت موجودیت‌ها، بازه زمانی، اهمیت دارایی و کیفیت داده را مشخص می‌کند و نتیجه را مستند می‌سازد.','An event is a logged observation. An alert is detection-rule output, not necessarily an attack. An incident is determined from evidence under organizational policy. Tier 1 establishes entities, time boundaries, asset criticality and telemetry quality, then documents a supported disposition.')],
[B('اولویت را از اثر واقعی بگیر','Prioritize by business impact'),B('Severity قانون را با اولویت پرونده اشتباه نگیر. حساب مدیر دامنه، سرور حیاتی، گسترش روی چند میزبان و شواهد اجرای فعال، اولویت را بالا می‌برند. SLA و ماتریس شدت سازمان را دنبال کن؛ یک امتیاز Risk به‌تنهایی احتمال قطعی آلودگی نیست.','Rule severity is not case priority. Domain administrators, critical servers, multiple affected hosts and active execution raise priority. Follow the organization’s SLA and severity matrix. A risk score is not a calibrated probability of compromise.')],
[B('حد اختیار و تحویل شیفت','Authority and shift handoff'),B('بدون مجوز پلی‌بوک، میزبان را ایزوله یا حساب را مسدود نکن. در تحویل بنویس چه دیده‌ای، چه چیز نامعلوم است، چه جست‌وجوهایی انجام شده و چه اقدام فوری لازم است. شواهد حساس را فقط در مخزن مجاز نگه دار و زمان‌ها را با منطقه زمانی ثبت کن.','Do not isolate a host or disable an account without playbook authorization. Handoffs must distinguish observations from unknowns, list searches already performed and state the required next action. Store sensitive evidence in approved repositories and record timestamps with their timezone.')]
],B('یک هشدار High بدون اطلاعات دارایی چه معنایی دارد؟','What does a High alert without asset context establish?'),[B('رخداد قطعی و آماده ایزوله‌سازی است','A confirmed incident ready for isolation'),B('برای تعیین اولویت به زمینه و شواهد نیاز دارد','It needs context and evidence to establish priority')],1,B('شدت قانون فقط یکی از ورودی‌های تصمیم است.','Rule severity is only one input to the decision.')),
L('telemetry','foundation',B('کیفیت لاگ و نقاط کور','Telemetry quality & blind spots'),B('چرا «نتیجه‌ای پیدا نشد» مساوی «حمله‌ای نبود» نیست.','Why “no results” does not mean “no attack.”'),[
[B('قبل از تحلیل، داده را اعتبارسنجی کن','Validate data before interpretation'),B('وجود sourcetype، آخرین زمان دریافت، تعداد معمول رویداد و مجوز جست‌وجوی index را بررسی کن. _time زمان رویداد و _indextime زمان ایندکس شدن است؛ اختلاف غیرمنتظره می‌تواند تأخیر دریافت یا مشکل ساعت باشد. EventCode ممکن است با EventID یا فیلدهای XML جایگزین شده باشد.','Check sourcetype availability, last ingestion, baseline volume and index permissions. _time represents event time and _indextime represents indexing time. An unexpected gap can reflect ingestion delay or clock issues. EventCode may instead be extracted as EventID or XML-specific fields.')],
[B('نرمال‌سازی با حفظ معنای فیلد','Normalize without losing meaning'),B('host در Splunk لزوماً سیستم قربانی نیست؛ ممکن است جمع‌کننده لاگ باشد. dest، Computer و نام میزبان EDR را مقایسه کن. برای user بین عامل انجام‌دهنده و حساب هدف تفاوت بگذار. raw event را باز کن تا نگاشت اشتباه باعث نسبت دادن رویداد به فرد دیگری نشود.','Splunk host may identify a collector rather than the affected endpoint. Compare dest, Computer and EDR device identity. Separate acting users from target accounts. Inspect raw events to avoid attributing activity to the wrong entity after an incorrect field mapping.')],
[B('دامنه نتیجه‌گیری','Limit your conclusion to observed coverage'),B('اگر Sysmon نصب نیست یا ثبت 4104 فعال نشده، نبود داده دلیلی برای سالم بودن سیستم نیست. retention، همگام‌سازی ساعت و لاگ‌های حذف‌شده را یادداشت کن. نتیجه مناسب در پوشش ناقص می‌تواند «شواهد ناکافی، ارجاع برای بررسی تکمیلی» باشد، نه بستن به عنوان FP.','If Sysmon is absent or 4104 logging is disabled, missing results cannot establish safety. Note retention, clock synchronization and missing logs. Incomplete coverage may warrant “insufficient evidence, escalate for further investigation,” not a false-positive closure.')]
],B('جست‌وجوی Sysmon صفر نتیجه دارد. اولین کار چیست؟','A Sysmon search returns zero results. What comes first?'),[B('بررسی ورود داده، زمان و مجوزها','Check ingestion, time bounds and permissions'),B('بستن هشدار به عنوان فالس','Close as a false positive')],0,B('ابتدا مشخص کن اصلاً داده قابل اتکایی در دسترس بوده است.','First establish whether reliable telemetry was available.')),
L('windows','endpoint',B('خواندن لاگ‌های Windows و Sysmon','Reading Windows & Sysmon logs'),B('شناسه‌های مهم، پیش‌نیازها و ارتباط بین رویدادها.','Key event IDs, prerequisites and event correlation.'),[
[B('لاگ‌های Security','Security event logs'),B('4624 ورود موفق، 4625 ورود ناموفق، 4688 ساخت پردازش و 1102 پاک شدن Security log را گزارش می‌کنند. Logon Type 3 شبکه و 10 ورود RemoteInteractive است؛ این‌ها به‌خودی‌خود مخرب نیستند. ثبت CommandLine در 4688 به پیکربندی auditing جداگانه نیاز دارد.','4624 records a successful logon, 4625 a failed logon, 4688 process creation and 1102 clearing of the Security log. Logon Type 3 is network and 10 is RemoteInteractive; neither is inherently malicious. Command-line capture in 4688 requires separate audit configuration.')],
[B('دید عمیق‌تر با Sysmon','Deeper visibility with Sysmon'),B('در Sysmon رویداد 1 ساخت پردازش، 3 اتصال شبکه، 10 دسترسی پردازش، 11 ساخت فایل، 13 تنظیم مقدار رجیستری و 22 پرس‌وجوی DNS است. پوشش به تنظیمات Sysmon و فیلترهای آن وابسته است؛ همه رویدادها پیش‌فرض ثبت نمی‌شوند. برای اتصال رویدادها ProcessGuid را به PID تنها ترجیح بده.','Sysmon event 1 is process creation, 3 network connection, 10 process access, 11 file creation, 13 registry value set and 22 DNS query. Coverage depends on Sysmon configuration and filters; not all event classes are logged by default. Prefer ProcessGuid over PID alone for correlation.')],
[B('زمینه احراز هویت','Authentication context'),B('Account، LogonId، IpAddress و نام سیستم را در کنار هم بررسی کن. در 4625 کد Status و SubStatus علت شکست را روشن‌تر می‌کنند؛ رمز اشتباه، حساب غیرفعال و محدودیت ورود رفتار یکسانی نیستند. 4768 و 4769 را برای Kerberos در کنترلر دامنه بررسی کن و 4776 را در زمینه اعتبارسنجی NTLM ببین.','Interpret account, LogonId, IpAddress and device identity together. Status and SubStatus in 4625 help distinguish invalid passwords, disabled accounts and restrictions. Review 4768 and 4769 for Kerberos on domain controllers, and 4776 in the context of NTLM credential validation.')]
],B('بهترین شناسه برای ارتباط پردازش‌های Sysmon چیست؟','Which identifier best correlates Sysmon process events?'),[B('فقط PID','PID alone'),B('ProcessGuid همراه میزبان و زمان','ProcessGuid with host and time')],1,B('PID قابل استفاده مجدد است؛ زمینه زمانی و ProcessGuid خطا را کم می‌کنند.','PIDs can be reused; ProcessGuid and time context reduce ambiguity.')),
L('process','endpoint',B('درخت پردازش، PowerShell و EDR','Process trees, PowerShell & EDR'),B('نام آشنا کافی نیست؛ زنجیره اجرا را بخوان.','A familiar filename is not enough. Follow the execution chain.'),[
[B('پدر، فرزند و مسیر','Parent, child and path'),B('مسیر فایل، امضای دیجیتال، هش، کاربر، سطح دسترسی و parent process را کنار هم قرار بده. اجرای PowerShell توسط Word با اجرای آن توسط ابزار مدیریت سازمانی یکسان نیست. فایل امضاشده هم ممکن است برای کار مخرب استفاده شود؛ نام و امضا شواهد کمکی‌اند، نه حکم نهایی.','Combine executable path, signature, hash, user, privileges and parent process. PowerShell launched by Word has different context from PowerShell launched by an enterprise management tool. Signed binaries can be abused; filename and signature support analysis but do not determine the verdict.')],
[B('PowerShell را فقط از روی -enc قضاوت نکن','Do not judge PowerShell by -enc alone'),B('4688 یا Sysmon 1 را با 4104 و اتصالات شبکه مرتبط کن. ثبت Script Block باید فعال باشد و یک اسکریپت ممکن است در چند رویداد تقسیم شود. محتوای رمزگذاری‌شده را فقط در ابزار تحلیل ایمن decode کن، نه با اجرای آن. اسکریپت مدیریتی هم ممکن است از encoding استفاده کند.','Correlate 4688 or Sysmon 1 with 4104 and network activity. Script Block Logging must be enabled, and a script may span multiple events. Decode suspicious content using a safe analysis tool, never by executing it. Legitimate administration may also use encoded commands.')],
[B('خروجی EDR را دقیق بخوان','Read EDR outcomes precisely'),B('Detected با blocked و quarantined فرق دارد. موفقیت پاک‌سازی را همراه رفتار قبل و بعد بررسی کن؛ مسدود شدن یک فایل، نبودن persistence یا سرقت قبلی را ثابت نمی‌کند. برای hash lookup ابتدا سیاست اشتراک داده را بررسی کن؛ فایل یا اسکریپت محرمانه را در سرویس عمومی بارگذاری نکن.','Detected, blocked and quarantined describe different outcomes. Validate remediation and inspect behavior before and after it. Blocking one file does not exclude prior persistence or theft. Follow data-sharing policy before reputation checks; do not upload confidential files or scripts to public services.')]
],B('یک فایل امضای معتبر دارد. آیا سالم است؟','Does a valid signature establish that a file is safe?'),[B('بله، می‌توان هشدار را بست','Yes, close the alert'),B('خیر، رفتار و زنجیره اجرا هم لازم است','No, execution context and behavior still matter')],1,B('ابزارهای معتبر هم در حملات Living off the Land استفاده می‌شوند.','Legitimate tools are also used in living-off-the-land attacks.'),refs.powershell),
L('persistence','endpoint',B('ماندگاری، دسترسی به اعتبارنامه و باج‌افزار','Persistence, credentials & ransomware'),B('رفتارهایی که معمولاً به ارجاع سریع نیاز دارند.','Behaviors that commonly require rapid escalation.'),[
[B('ردپای ماندگاری','Persistence evidence'),B('ساخت سرویس را در System 7045 یا Security 4697 در صورت فعال بودن auditing بررسی کن. ساخت Scheduled Task در 4698 و تغییر Run keys در تله‌متری رجیستری اهمیت دارند. سازنده، مسیر اجرایی، زمان ایجاد، ticket تغییر و اولین اجرای واقعی را ثبت کن؛ صرف ایجاد سرویس دلیل حمله نیست.','Review service installation in System 7045 or Security 4697 when auditing is configured. Scheduled task creation in 4698 and Run-key changes are relevant. Record creator, executable path, creation time, change authorization and first observed execution. Service creation alone is not an attack.')],
[B('دسترسی به LSASS','LSASS access'),B('دسترسی به lsass.exe در Sysmon 10 را با SourceImage، GrantedAccess، CallTrace در صورت وجود و زمینه EDR بررسی کن. ابزار امنیتی و diagnostic هم ممکن است چنین دسترسی‌ای داشته باشند. ابزار ناشناخته، dump file یا زنجیره اجرای مشکوک در کنار آن، دلیل ارجاع برای credential access است.','Inspect Sysmon 10 access to lsass.exe using SourceImage, GrantedAccess, available CallTrace and EDR context. Security and diagnostic tools can access LSASS legitimately. An unknown source process, dump artifacts or a suspicious execution chain warrants credential-access escalation.')],
[B('باج‌افزار: زمان مهم است','Ransomware: time matters'),B('تغییر گسترده فایل‌ها، پسوندهای تازه، ransom note و رفتار حذف نسخه پشتیبان را هم‌بسته کن. اگر رمزگذاری فعال محتمل است طبق مسیر فوری سازمان به Tier 2 یا Incident Response اطلاع بده. برای تکمیل تمام چک‌ها منتظر نمان؛ اقدام containment فقط طبق مجوز و با ثبت زمان انجام شود.','Correlate widespread file changes, new extensions, ransom notes and backup-removal behavior. Suspected active encryption requires the emergency escalation route. Do not wait to finish every checklist. Containment must follow authorization and preserve a timestamped action record.')]
],B('رمزگذاری فعال روی چند سرور دیده می‌شود. چه می‌کنی؟','Active encryption appears on multiple servers. What next?'),[B('ارجاع فوری طبق پلی‌بوک و ثبت شواهد','Escalate immediately under the playbook and preserve evidence'),B('صبر تا پایان همه جست‌وجوها','Wait until every search is finished')],0,B('تحلیل نباید پاسخ به تهدید فعال را بی‌دلیل عقب بیندازد.','Analysis should not unnecessarily delay response to an active threat.')),
L('linux','endpoint',B('اندپوینت‌های Linux و کنترل‌های پایه','Linux endpoints & defensive controls'),B('SSH، sudo، cron و تفاوت کنترل پیشگیرانه با تله‌متری.','SSH, sudo, cron and prevention versus visibility.'),[
[B('منابع داده لینوکس','Linux data sources'),B('بسته به توزیع، auth.log، secure، journald و auditd را بررسی کن. SSH failed و accepted login، sudo و تغییرات کاربر منابع مهم‌اند. لاگ shell history کامل یا قابل اتکا نیست؛ ثبت execve در auditd و داده EDR در صورت پیکربندی، دید بهتری از اجرای پردازش می‌دهند.','Depending on distribution, review auth.log, secure, journald and auditd. SSH failures and accepted logins, sudo and account changes are important. Shell history is neither complete nor tamper-resistant; configured auditd execve events and EDR telemetry provide stronger execution visibility.')],
[B('تغییرات حساس','Sensitive changes'),B('تغییر authorized_keys، cron، واحدهای systemd و حساب‌های دارای امتیاز را با مالک سیستم تطبیق بده. IP ابزار مدیریت، پنجره تغییر و دستور مجاز را بررسی کن. فعالیت root به‌تنهایی کافی نیست، اما ورود جدید از مبدأ غیرمعمول همراه تغییر ماندگاری باید ارجاع شود.','Validate authorized_keys changes, cron entries, systemd units and privileged-account changes with the system owner. Check management sources, approved windows and expected commands. Root activity alone is not decisive; a new unusual login followed by persistence changes warrants escalation.')],
[B('کنترل‌های پیشگیرانه و کشف','Preventive and detective controls'),B('حداقل دسترسی، patching، MFA برای دسترسی مدیریتی، محدودسازی شبکه و پشتیبان قابل بازیابی سطح خطر را کم می‌کنند. EDR و SIEM جایگزین این کنترل‌ها نیستند. در پرونده بنویس کدام کنترل فعال بوده، چه چیزی را مسدود کرده و چه نقاط کوری باقی مانده است.','Least privilege, patching, administrative MFA, network restrictions and recoverable backups reduce exposure. EDR and SIEM do not replace these controls. Record which controls were active, what they blocked and which blind spots remained during the investigated activity.')]
],B('آیا نبود دستور در shell history نبود اجرا را ثابت می‌کند؟','Does an absent shell-history entry prove no execution?'),[B('بله','Yes'),B('خیر، تاریخچه ممکن است ناقص یا تغییرکرده باشد','No, history may be incomplete or modified')],1,B('به منابع مستقل اجرا و احراز هویت تکیه کن.','Use independent execution and authentication telemetry.')),
L('network','network',B('شبکه برای تحلیلگر SOC','Networking for SOC analysts'),B('از پنج‌تایی اتصال تا DNS، NAT و TLS.','From the connection five-tuple to DNS, NAT and TLS.'),[
[B('پنج‌تایی و جهت ترافیک','The five-tuple and direction'),B('src IP، src port، dest IP، dest port و protocol مبنای اتصال‌اند. جهت outbound را از جایگاه سنسور و subnetها تعیین کن، نه فقط نام فیلد. NAT، DHCP، VPN و proxy می‌توانند یک IP را به چند کاربر مرتبط کنند؛ نگاشت زمان‌مند برای نسبت دادن فعالیت لازم است.','Source IP, source port, destination IP, destination port and protocol identify a flow. Determine outbound direction from sensor placement and subnets, not field names alone. NAT, DHCP, VPN and proxies can associate one IP with multiple users; attribution needs time-specific mappings.')],
[B('DNS و HTTPS','DNS and HTTPS'),B('DNS نام را resolve می‌کند و می‌تواند برای C2 هم سوءاستفاده شود. query، نوع رکورد، پاسخ و نرخ درخواست را ببین. در HTTPS معمولاً محتوای رمزگذاری‌شده دیده نمی‌شود؛ SNI در صورت قابل مشاهده بودن، گواهی و فراداده کمک می‌کنند. نبود URL کامل یا SNI را به معنی نبود اتصال نگذار.','DNS resolves names and can also be abused for command and control. Inspect query, record type, response and request rate. HTTPS usually hides content; visible SNI, certificates and metadata can help. Missing full URLs or SNI does not mean there was no connection.')],
[B('پورت به معنی برنامه قطعی نیست','A port does not prove an application'),B('443 اغلب HTTPS، 53 اغلب DNS، 445 اغلب SMB و 3389 معمولاً RDP است، اما برنامه‌ها می‌توانند روی پورت دیگر باشند. برای تشخیص از app identification، لاگ مقصد و پردازش مبدأ کمک بگیر. allowed در firewall فقط مجاز بودن عبور را نشان می‌دهد، نه موفقیت برنامه یا بی‌خطر بودن ترافیک.','443 commonly carries HTTPS, 53 DNS, 445 SMB and 3389 RDP, but services can use other ports. Correlate application identification, destination logs and source processes. A firewall allow decision indicates permitted traversal, not application success or harmless traffic.')]
],B('یک IP پشت NAT دیده شده؛ می‌توان کاربر را قطعی شناخت؟','An IP behind NAT is observed. Can you identify the user conclusively?'),[B('فقط با IP خیر؛ نگاشت زمان‌مند لازم است','Not from the IP alone; time-specific mapping is needed'),B('بله، هر IP فقط یک کاربر دارد','Yes, each IP has one user')],0,B('زمان، پورت و لاگ‌های NAT یا VPN می‌توانند برای نسبت دادن لازم باشند.','Timestamp, ports and NAT or VPN records may be needed for attribution.')),
L('visibility','network',B('Firewall، Proxy، IDS و تحلیل DNS','Firewall, proxy, IDS & DNS analysis'),B('هر سنسور چه چیزی می‌بیند و چه چیزی را نمی‌بیند؟','What can each sensor see, and what does it miss?'),[
[B('چند زاویه دید را کنار هم بگذار','Combine multiple vantage points'),B('Firewall درباره session و policy، proxy درباره درخواست وب، IDS درباره تطبیق signature و EDR درباره پردازش مبدأ اطلاعات می‌دهند. یک signature ممکن است تلاش ناموفق یا ترافیک scanner را ببیند. action، bytes، مدت اتصال و نتیجه روی مقصد را کنار signature بررسی کن.','Firewalls expose sessions and policy, proxies web requests, IDS signature matches, and EDR source processes. A signature may identify an unsuccessful attempt or scanner traffic. Evaluate action, bytes, duration and destination outcomes alongside the signature.')],
[B('Beaconing و خروج داده','Beaconing and exfiltration'),B('اتصال دوره‌ای و حجم خروجی بالا نشانه‌اند، نه اثبات. ابزار monitoring، sync و backup هم این الگوها را دارند. با baseline همان دارایی در ساعت مشابه مقایسه کن و مقصد، برنامه مالک، نسبت ارسال به دریافت و تغییر ناگهانی رفتار را بررسی کن. اسکن رمزگذاری‌شده محدودیت دید دارد.','Periodic connections and high outbound volume are signals, not proof. Monitoring, sync and backup tools can produce both. Compare the asset’s baseline at comparable times, then inspect destination, owning application, send/receive ratios and abrupt changes. Encrypted traffic limits visibility.')],
[B('دام‌های تحلیل DNS','DNS interpretation pitfalls'),B('طول زیاد query، زیر‌دامنه‌های یکتا و NXDOMAIN زیاد می‌توانند از telemetry یا CDN ناشی شوند. نرخ و نوع رکورد را با پردازش endpoint هم‌بسته کن. جدا کردن دو قسمت آخر نام دامنه برای همه دامنه‌ها درست نیست؛ برای registered domain از نگاشت معتبر Public Suffix استفاده کن.','Long queries, many unique subdomains and frequent NXDOMAIN responses may come from telemetry or CDNs. Correlate rates and record types with endpoint processes. Taking the last two labels does not always yield the registered domain; use a validated Public Suffix mapping.')]
],B('ارسال حجیم شبانه به‌تنهایی نشانه قطعی سرقت است؟','Does large overnight upload volume prove exfiltration?'),[B('بله','Yes'),B('خیر، مقصد، baseline و مالکیت backup را بررسی کن','No, inspect destination, baseline and backup ownership')],1,B('رفتار غیرعادی باید در زمینه همان دارایی ارزیابی شود.','Anomalies require the context of the specific asset.'),refs.dns),

[B('Brute force و password spray','Brute force versus password spray'),B('تلاش‌های زیاد روی یک حساب می‌تواند brute force باشد؛ چند تلاش روی حساب‌های بسیار می‌تواند spray باشد. شمارش را با src، user، dest و پنجره زمانی حفظ کن. شکست و موفقیت در یک bucket اثبات نمی‌کند موفقیت بعد از شکست بوده؛ ترتیب واقعی رویدادها را بررسی کن.','Many attempts against one account can indicate brute force; a few attempts against many accounts can indicate spraying. Preserve source, user, destination and time window. Failures and successes in one bucket do not prove success followed failure; inspect event ordering.')],
[B('MFA و جغرافیای ورود','MFA and login geography'),B('MFA موفق هم تضمین سلامت نیست؛ سرقت session یا تأیید ناخواسته ممکن است رخ دهد. impossible travel به خروجی VPN و خطای GeoIP حساس است. device، session، ASN، روش MFA و رفتار پس از ورود را ببین و تأیید کاربر را از کانال مستقل بگیر.','Successful MFA is not a safety guarantee; session theft or unintended approval may occur. Impossible travel is sensitive to VPN egress and GeoIP errors. Review device, session, ASN, MFA method and post-login activity, and verify with the user through an independent channel.')],
[B('تحلیل فیشینگ بدون اجرای محتوا','Phishing investigation without execution'),B('Message-ID، هدر، envelope sender، Reply-To، نتایج SPF/DKIM/DMARC و گیرندگان را ثبت کن. pass شدن احراز دامنه سالم بودن پیام را ثابت نمی‌کند. مقصد واقعی لینک و تله‌متری کلیک، دانلود و پردازش را بررسی کن؛ لینک یا پیوست را روی سیستم کاری باز نکن.','Record Message-ID, headers, envelope sender, Reply-To, SPF/DKIM/DMARC results and recipients. Passing domain authentication does not establish message safety. Inspect actual link destinations and click, download and execution telemetry. Do not open suspicious links or attachments on your workstation.')]

L('splunk','splunk',B('شناخت Splunk و مسیر داده','Splunk and the data pipeline'),B('Index، sourcetype، field و تفاوت Search با Enterprise Security.','Indexes, sourcetypes, fields and Search versus Enterprise Security.'),[
[B('از جمع‌آوری تا جست‌وجو','From collection to search'),B('Forwarder داده را ارسال، indexer آن را پردازش و ذخیره و search head جست‌وجو را هماهنگ می‌کند؛ معماری واقعی می‌تواند متفاوت باشد. index مجموعه داده و sourcetype قالب و قواعد پردازش آن را مشخص می‌کند. با index محدود و بازه زمانی مشخص شروع کن، نه index=* و all time.','Forwarders ship data, indexers process and store it, and search heads coordinate searches; deployment architectures vary. Index selects a data collection, while sourcetype identifies format and processing rules. Start with a scoped index and bounded time range, not index=* and all time.')],
[B('Enterprise Security و یافته‌ها','Enterprise Security and findings'),B('Splunk Enterprise Security امکانات امنیتی روی پلتفرم Splunk ارائه می‌کند و نیازمند نصب و مجوز مربوط است. اصطلاح Finding، Notable و محل بررسی با نسخه فرق می‌کند. جزئیات detection، زمان اجرای search، drilldown و موجودیت‌های تحت تأثیر را باز کن؛ عنوان alert همه منطق قانون را نمی‌گوید.','Splunk Enterprise Security adds security workflows to the Splunk platform and requires the relevant installation and licensing. Finding, Notable and investigation interfaces vary by version. Inspect the detection logic, scheduled search time, drilldowns and entities; an alert title does not describe all rule logic.')],
[B('زمان و حفظ شواهد','Time and evidence preservation'),B('بازه جست‌وجوی detection را عیناً ثبت کن، سپس برای زمینه چند دقیقه قبل و بعد را بررسی و بر اساس شواهد گسترش بده. زمان نسبی برای کار روزمره خوب است، اما در تحویل زمان شروع و پایان مطلق با timezone بده. SPL، job reference در صورت پایدار بودن و نمونه raw را در محل مجاز ثبت کن.','Record the detection’s exact search interval, then inspect context before and after and expand as justified. Relative times are convenient, but handoffs need absolute start/end timestamps and timezone. Preserve SPL, durable job references where available and relevant raw evidence in approved storage.')]

[B('جست‌وجو را مرحله‌به‌مرحله بساز','Build searches incrementally'),B('ابتدا index، sourcetype و زمان را محدود کن، raw event را ببین، بعد fields یا table برای خروجی مشخص استفاده کن. stats count by user شمارش می‌دهد؛ values(dest) زمینه چندمقداری و dc(dest) تعداد مقصد یکتا را نگه می‌دارند. پس از stats فیلدهای تجمیع‌نشده از خروجی حذف می‌شوند.','Scope index, sourcetype and time first, inspect raw events, then use fields or table for focused output. stats count by user counts events; values(dest) retains destination context and dc(dest) counts unique destinations. Fields not grouped or aggregated are lost after stats.')],
[B('eval، where و bin','eval, where and bin'),B('eval فیلد محاسباتی می‌سازد و where برای شرط روی آن مناسب است. با bin _time span=5m رخدادها را bucket کن؛ مرز bucket می‌تواند یک دنباله حمله را بشکند. sort 0 + _time ترتیب صعودی بدون محدودیت پیش‌فرض sort می‌دهد، اما برای داده زیاد هزینه دارد؛ ابتدا دامنه را کم کن.','eval creates calculated fields and where filters expressions over them. bin _time span=5m creates buckets, whose boundaries can split an attack sequence. sort 0 + _time provides ascending order without the default sort limit but can be expensive; constrain the data first.')],
[B('صفر نتیجه و فیلدهای خالی','Zero results and missing fields'),B('از نام index و فیلدهای همین محیط استفاده کن؛ مثال‌های این سایت قرارداد آموزشی دارند. فیلتر را تدریجی حذف کن و extraction را بررسی کن. coalesce فقط فیلدهای هم‌معنی را جایگزین کند. dedup بی‌دلیل ممکن است شواهد تکرار را حذف کند و join یا subsearch محدودیت حجم و زمان دارند.','Use the indexes and fields of your environment; this site uses explicit teaching contracts. Relax filters incrementally and inspect extraction. coalesce should combine semantically equivalent fields only. Unnecessary dedup can remove repetition evidence, and joins or subsearches have result and time limits.')]

[B('CIM قرارداد معناست','CIM is a semantic contract'),B('Common Information Model نام و معنای مشترک برای داده‌های چند vendor فراهم می‌کند. برای Authentication نگاشت user، src، dest و action را اعتبارسنجی کن. نصب Add-on به‌تنهایی تضمین کامل بودن مدل نیست؛ eventtype، tag، extraction و داده ورودی باید با مدل تطبیق داشته باشند.','The Common Information Model standardizes field names and meaning across vendors. Validate user, src, dest and action mappings for Authentication. Installing an add-on alone does not guarantee complete data-model coverage; eventtypes, tags, extractions and source data must match the model.')],
[B('tstats و خطر خلاصه ناقص','tstats and incomplete summaries'),B('tstats از فیلدهای indexed یا مدل داده استفاده می‌کند؛ جایگزین عمومی search روی هر فیلد دلخواه نیست. summariesonly=true فقط summary را می‌بیند و داده خلاصه‌نشده را کنار می‌گذارد. برای بررسی کامل‌تر false را در نظر بگیر و پوشش مدل، تأخیر acceleration و مقایسه با raw را بررسی کن.','tstats uses indexed fields or data models; it is not a universal replacement for search over arbitrary fields. summariesonly=true reads summaries only and excludes unsummarized data. Consider false for more complete investigation and validate model coverage, acceleration lag and raw-event consistency.')],
[B('Risk را با احتمال اشتباه نگیر','Risk is not probability'),B('در RBA چند سیگنال برای یک موجودیت جمع می‌شوند و ممکن است به finding منجر شوند. امتیاز 80 به معنی احتمال 80 درصد آلودگی نیست. mapping اشتباه user یا dest، تکرار قانون و وزن‌های نامناسب می‌تواند امتیاز را منحرف کند؛ سیگنال‌های سازنده و بازه تجمیع را بخوان.','RBA accumulates signals against entities and can produce findings. A score of 80 does not mean an 80% compromise probability. Incorrect entity mapping, duplicate detections and unsuitable weights can distort scores. Inspect contributing signals and the aggregation window.')]

[B('۱. اعتبارسنجی و زمینه','1. Validate and contextualize'),B('زمان و منطق قانون، موجودیت، مالک دارایی و پوشش داده را مشخص کن. آیا قانون threshold است یا رفتار مشخص؟ آیا زمان‌بندی و lookback رویداد تکراری ساخته؟ با CMDB، هویت سازمانی و تغییرات مصوب زمینه بگیر. اجازه نده label شدت جای تحقیق را بگیرد.','Establish rule logic, time window, entities, asset owner and telemetry coverage. Is the rule threshold-based or behavior-specific? Did scheduling and lookback generate duplicates? Use CMDB, identity records and approved changes for context. Do not let a severity label replace investigation.')],
[B('۲. خط زمانی و دامنه','2. Timeline and scope'),B('در یک پنجره اولیه محدود، پردازش، ورود، DNS و شبکه را هم‌بسته کن. سپس همان user، hash یا مقصد را روی سایر دارایی‌های مرتبط جست‌وجو کن. هم‌زمانی رابطه علت و معلولی را ثابت نمی‌کند؛ شناسه process، session و داده مستقل را برای پیوند دادن لازم داری.','Correlate process, authentication, DNS and network activity in an initial bounded window. Expand to related assets using user, hash or destination pivots. Temporal proximity does not establish causation; process IDs, session identifiers and independent evidence strengthen linkage.')],
[B('۳. تصمیم با شرایط توقف','3. Disposition and stop conditions'),B('اجرای مخرب محتمل، حساب حساس، گسترش، سرقت داده یا خلأ مهم تله‌متری را طبق ماتریس سازمان ارجاع بده. برای رخداد فعال منتظر قطعیت نمان. اگر فعالیت مجاز اثبات شد، دامنه تأیید، مدارک، محدودیت‌ها و دلیل بستن را بنویس. tuning قانون باید کنترل تغییر و بازبینی داشته باشد.','Escalate plausible malicious execution, sensitive-account impact, spread, data theft or material telemetry gaps under the organization’s matrix. Do not wait for certainty during active harm. For verified authorized activity, record scope, supporting evidence, limitations and closure rationale. Rule tuning needs change control and review.')]

L('disposition','foundation',B('فالس‌پازیتیو، فعالیت مجاز و بستن پرونده','False positives, benign activity & closure'),B('هیچ میان‌بری برای «صددرصد فالس» وجود ندارد.','There is no shortcut to “100% false positive.”'),[
[B('چهار نتیجه را جدا نگه دار','Keep four outcomes distinct'),B('True Positive یعنی رفتار موردنظر قانون واقعاً رخ داده و در زمینه امنیتی نیازمند پاسخ است. Benign True Positive یعنی قانون رفتار را درست دیده ولی فعالیت مجاز است. False Positive می‌تواند ناشی از منطق یا parsing غلط باشد. Inconclusive یعنی شواهد کافی نیست. نام نهایی وضعیت‌ها را با taxonomy سازمان هماهنگ کن.','A true positive indicates the intended security-relevant behavior occurred and warrants response. A benign true positive correctly detects authorized activity. A false positive can arise from faulty logic or parsing. Inconclusive means evidence is insufficient. Align final labels with the organization’s taxonomy.')],
[B('چه شواهدی برای بستن لازم است؟','What evidence supports closure?'),B('در نمونه اسکریپت مدیریتی، ticket معتبر، تأیید مالک از کانال مستقل، تطبیق زمان و میزبان و فرمان مورد انتظار و نبود شواهد متناقض در تله‌متری موجود را ثبت کن. نام شناخته‌شده فایل، IP داخلی، امضای معتبر، reputation تمیز یا حرف کاربر به‌تنهایی کافی نیست. پوشش و محدودیت بررسی را صریح بنویس.','For an administrative script, record a valid change ticket, independent owner verification, matching host/time/expected command and no contradictory evidence within available telemetry. A known filename, internal IP, valid signature, clean reputation or user statement alone is insufficient. State investigation coverage and limitations explicitly.')],
[B('بستن مسئولانه و tuning محدود','Responsible closure and narrow tuning'),B('خلاصه پرونده باید پاسخ دهد چه شد، کجا، چه وقت، برای چه کسی و چرا این تصمیم گرفته شد. استثنا را به ابزار، میزبان، حساب و بازه معتبر محدود کن؛ allowlist کلی PowerShell یا حساب مدیر خطرناک است. برای استثنا مالک، تاریخ انقضا و بازبینی تعیین کن. «چیزی ندیدم» را جای «فعالیت مجاز تأیید شد» ننویس.','A closure summary answers what happened, where, when, to whom and why this disposition was selected. Scope exceptions to approved tools, hosts, accounts and valid windows; broadly allowlisting PowerShell or administrators is unsafe. Assign an owner, expiry and review. “Nothing found” is not “authorized activity verified.”')]

const glossary=[['SIEM',B('سامانه گردآوری و هم‌بستگی رویدادهای امنیتی؛ کیفیت آن به پوشش داده و منطق تشخیص وابسته است.','Security event collection and correlation; effectiveness depends on telemetry coverage and detection quality.')],['EDR',B('دید و قابلیت پاسخ روی اندپوینت؛ وضعیت detected را با blocked اشتباه نگیر.','Endpoint detection and response; detected does not necessarily mean blocked.')],['IOC / IOA',B('IOC نشانه‌ای مانند hash یا domain است؛ IOA الگوی رفتار حمله. هیچ‌کدام بدون زمینه حکم قطعی نیستند.','An IOC is an indicator such as a hash/domain; an IOA is attack behavior. Both require context.')],['TTP',B('تاکتیک، تکنیک و روش اجرایی مهاجم؛ نگاشت ATT&CK طبقه‌بندی است، نه اثبات حمله.','Tactics, techniques and procedures. ATT&CK mapping classifies behavior; it does not prove an attack.')],['CIM',B('قرارداد مشترک معنای فیلدها برای تحلیل داده‌های vendorهای متفاوت در Splunk.','A common semantic field contract for cross-vendor analysis in Splunk.')],['RBA',B('تجمیع سیگنال‌های خطر برای یک موجودیت؛ امتیاز Risk احتمال آماری آلودگی نیست.','Entity-based aggregation of risk signals; risk scores are not compromise probabilities.')],['False Positive',B('هشدار نامعتبر به علت خطای تشخیص یا داده، طبق تعریف سازمان؛ با فعالیت مجازِ درست تشخیص‌داده‌شده فرق دارد.','An invalid alert caused by detection/data error under organizational taxonomy; distinct from correctly detected benign behavior.')],['Benign True Positive',B('قانون رفتار موردنظر را درست یافته ولی فعالیت در زمینه سازمان مجاز است.','The rule correctly detected the intended behavior, but that activity is authorized in context.')],['Inconclusive',B('شواهد برای تعیین تکلیف کافی نیست؛ باید خلأ داده و اقدام بعدی ثبت شود.','Evidence is insufficient for a disposition; record gaps and next steps.')],['Dwell time',B('مدت حضور مهاجم پیش از کشف؛ تعریف و نقطه شروع اندازه‌گیری را مشخص کن.','Time an adversary remains before detection; define the start point and measurement convention.')],['Containment',B('محدود کردن اثر رخداد با اقدام مصوب، مانند ایزوله‌سازی؛ وظیفه بدون مجوز Tier 1 نیست.','Authorized limitation of incident impact, such as isolation; not an unapproved Tier 1 action.')],['Chain of custody',B('ثبت اینکه شواهد چه زمانی، توسط چه کسی و چگونه دریافت و منتقل شده‌اند.','Documentation of when, how and by whom evidence was collected and transferred.')]];

function renderFrame(){document.getElementById('sidebar').innerHTML=`<div class="brand"><div class="brand-mark">e</div><div><b>ERMANIAN</b><small>SOC ACADEMY</small></div></div><div class="nav-label">${text('یادگیری، با شواهد','LEARN WITH EVIDENCE')}</div><nav class="nav" aria-label="${text('ناوبری اصلی','Main navigation')}">${['home','courses','playbooks','lab','glossary'].map(n=>`<button class="${state.page===n||(n==='courses'&&state.page==='lesson')||(n==='playbooks'&&state.page==='playbook')?'active':''}" onclick="go('${n}')">${ico(n)}${E(t(navnames[n]))}${n==='courses'?'<span class="nav-num">14</span>':n==='playbooks'?'<span class="nav-num">08</span>':''}</button>`).join('')}</nav><div class="side-bottom"><nav class="nav"><button class="${state.page==='admin'?'active':''}" onclick="go('admin')">${ico('admin')}${t(navnames.admin)}</button><button class="${state.page==='sources'?'active':''}" onclick="go('sources')">${ico('sources')}${t(navnames.sources)}</button></nav><div class="side-note">${text('محیط آموزشی مستقل<br>بدون اتصال به SIEM واقعی','Independent learning environment<br>Not connected to a live SIEM')}</div><div class="identity"><span class="avatar">${state.user?E(state.user.name.slice(0,1)):'T1'}</span><div><strong class="small">${state.user?E(state.user.name):text('تحلیلگر مهمان','Guest analyst')}</strong><div class="small muted">${state.user?E(state.user.role):text('حالت مطالعه و تمرین','Read & practice mode')}</div></div></div></div>`;
document.getElementById('topbar').innerHTML=`<div class="row"><button class="icon mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="${text('باز کردن منو','Open navigation')}">☰</button><div class="breadcrumb">${text('آکادمی ارمانیان','Ermanian Academy')} <span style="padding:0 10px">/</span> <span style="color:var(--text)">${t(navnames[state.page]||B('مطالعه و بررسی','Read & investigate'))}</span></div></div><div class="top-tools"><form class="global-search" onsubmit="event.preventDefault();globalSearch(this.q.value)"><input name="q" aria-label="${text('جست‌وجوی آموزش','Search learning content')}" placeholder="${text('جست‌وجو در آموزش‌ها…','Search the academy…')}"></form><button onclick="setLang()" lang="en" aria-label="${text('تغییر زبان به انگلیسی','Switch to Persian')}">${state.lang==='fa'?'EN':'فارسی'}</button><button class="icon" onclick="setTheme()" aria-label="${text('تغییر تم','Toggle theme')}">${state.theme==='dark'?'☼':'◐'}</button><button class="login-btn" onclick="${state.user?'logout()':"go('auth')"}">${state.user?text('خروج','Sign out'):text('ورود / عضویت','Sign in / Join')}</button></div>`}
function title(h,p,b=''){return `<div class="page-top row between"><div><h1>${h}</h1><p>${p}</p></div>${b}</div>`}
function home(){const done=state.progress.length;return `${title(text('میز کار تحلیلگر','The analyst’s workspace'),text('قدم‌به‌قدم یاد بگیر. با شواهد تصمیم بگیر.','Learn deliberately. Decide with evidence.'),`<span class="pill"><span class="dot"></span> SOC TIER 01</span>`)}<section class="welcome"><div class="welcome-copy"><span class="eyebrow">FIELD NOTES / VOL. 01</span><h2>${text('از هشدار،<br>به شواهد.','From alerts.<br>To evidence.')}</h2><p>${text('امنیت اندپوینت و شبکه را یاد بگیر، در Splunk بررسی کن و برای هر تصمیم دلیل داشته باش.','Understand endpoints and networks. Investigate in Splunk. Build a case for every decision.')}</p><button onclick="go('lesson','${lessons.find(l=>!state.progress.includes(l.id))?.id||'soc'}')">${done?text('ادامه مسیر یادگیری','Continue learning'):text('شروع مسیر یادگیری','Start the learning path')} <span style="padding-inline-start:16px">${state.lang==='fa'?'←':'→'}</span></button></div><div class="signal-art" aria-hidden="true"><svg viewBox="0 0 360 255" fill="none"><g stroke="oklch(43% .055 112)" stroke-width="1.3"><path d="M54 59h72v67h37M54 126h109M54 194h72v-68M210 126h47V59h62M257 126h62M257 126v68h62"/><circle cx="126" cy="126" r="4" fill="oklch(43% .055 112)"/><circle cx="257" cy="126" r="4" fill="oklch(43% .055 112)"/></g><g fill="oklch(87% .105 112)" stroke="oklch(43% .055 112)"><rect x="16" y="38" width="66" height="42" rx="7"/><rect x="16" y="105" width="66" height="42" rx="7"/><rect x="16" y="173" width="66" height="42" rx="7"/><rect x="285" y="38" width="60" height="42" rx="7"/><rect x="285" y="105" width="60" height="42" rx="7"/><rect x="285" y="173" width="60" height="42" rx="7"/></g><path d="m186 73 44 25v53l-44 26-44-26V98z" fill="oklch(23% .03 112)"/><path d="m179 108 17 16-17 16m19 0h12" stroke="oklch(85% .135 112)" stroke-width="3"/><g fill="oklch(23% .03 112)" font-size="11" font-family="monospace" text-anchor="middle"><text x="49" y="64">EDR</text><text x="49" y="131">DNS</text><text x="49" y="199">AUTH</text><text x="315" y="64">VERIFY</text><text x="315" y="131">PIVOT</text><text x="315" y="199">DECIDE</text><text x="186" y="220" font-size="12" letter-spacing="2">SPLUNK / SPL</text></g><circle cx="104" cy="59" r="3" fill="oklch(23% .03 112)"/><circle cx="273" cy="194" r="3" fill="oklch(23% .03 112)"/></svg></div></section><div class="hero-bottom"><span>◉ ${text('۱۴ درس پایه تا عملی','14 foundational & practical lessons')}</span><span>↳ ${text('۸ پلی‌بوک بررسی هشدار','8 investigation playbooks')}</span><span>⌘ ${text('فارسی و انگلیسی، کنار هم','Persian & English, side by side')}</span></div><div class="split"><section><div class="section-head"><h2>${text('مسیر یادگیری تو','Your learning path')}</h2><button onclick="go('courses')">${text('مشاهده همه','View all')} ↗</button></div>${[['foundation','01',B('ذهنیت و مبانی تحلیلگر','The analyst’s foundations'),B('نقش SOC، کیفیت داده، تصمیم‌گیری','SOC role, data quality, disposition')],['endpoint','02',B('امنیت اندپوینت‌ها','Endpoint security'),B('Windows، Linux، EDR و پردازش‌ها','Windows, Linux, EDR & processes')],['network','03',B('امنیت شبکه و هویت','Network & identity security'),B('DNS، ترافیک، احراز هویت و فیشینگ','DNS, traffic, authentication & phishing')],['splunk','04',B('بررسی با Splunk','Investigating with Splunk'),B('SPL، مدل داده، هم‌بستگی و تریاژ','SPL, data models, correlation & triage')]].map(([cat,n,h,d])=>`<button class="path-item" onclick="state.filter='${cat}';go('courses')"><span class="path-num">${n}</span><span><strong>${t(h)}</strong><small>${t(d)}</small></span><span class="go">${state.lang==='fa'?'←':'→'}</span></button>`).join('')}<div class="row between small muted" style="margin:20px 0 8px"><span>${text('پیشرفت مطالعه','Reading progress')}</span><span>${done} / ${lessons.length}</span></div><div class="progress"><div style="width:${done/lessons.length*100}%"></div></div></section><aside><div class="section-head"><h2>${text('پرونده پیشنهادی','Featured investigation')}</h2><span class="eyebrow muted">CASE / 001</span></div><section class="feature-case"><div class="row between"><span class="pill high"><span class="dot"></span>${text('اولویت بالا','HIGH')}</span><span class="mono small muted">T1059.001</span></div><h3>${text('وقتی Word،<br>PowerShell اجرا می‌کند','When Word<br>launches PowerShell')}</h3><p>${text('یک زنجیره اجرای غیرمنتظره. parent process، فرمان و ارتباط شبکه را دنبال کن.','An unexpected execution chain. Follow the parent process, command and network activity.')}</p><button onclick="go('playbook','powershell')">${text('باز کردن پرونده','Open investigation')} ↗</button></section><div class="rule"><b>${text('اصل مهم تحلیلگر:','An analyst’s principle:')}</b> ${text('نبود شواهد مخرب، اثبات بی‌خطر بودن نیست. «صددرصد فالس» را با نتیجه مستند جایگزین کن.','No malicious evidence is not proof of safety. Replace “100% false” with an evidence-backed disposition.')}</div></aside></div><section class="mt"><div class="section-head"><h2>${text('از کدام هشدار شروع کنیم؟','Which alert should we investigate?')}</h2><button onclick="go('playbooks')">${text('کتابخانه پلی‌بوک‌ها','Playbook library')} ↗</button></div>${bookTable(playbooks.slice(0,3))}</section>${footer()}`}
function footer(){return `<footer class="footnote row between wrap"><span>ERMANIAN SOC ACADEMY <span class="mono">/ 01</span></span><span>${text('آموزشی؛ داده‌ها و سناریوهای تمرین ساختگی هستند.','Educational; practice data and scenarios are synthetic.')}</span></footer>`}
function globalSearch(q){state.page='courses';state.filter='all';state.search=q;render()}
function courses(){const visible=lessons.filter(l=>(state.filter==='all'||l.cat===state.filter)&&JSON.stringify(l).toLowerCase().includes(state.search.toLowerCase()));const arts=state.articles.filter(a=>a.published&&!a.id.startsWith('core-')&&JSON.stringify(a).toLowerCase().includes(state.search.toLowerCase()));return `${title(text('مسیر یادگیری','Learning path'),text('مبانی را بساز، بعد سراغ رفتار و شواهد برو.','Build the foundations, then investigate behavior and evidence.'))}<input class="search-wide" aria-label="${text('جست‌وجوی درس','Search lessons')}" placeholder="${text('جست‌وجو: PowerShell، DNS، فالس‌پازیتیو…','Search: PowerShell, DNS, false positives…')}" value="${E(state.search)}" oninput="filterLessons(this.value)"><div class="filters">${Object.entries(categories).map(([k,v])=>`<button class="${state.filter===k?'active':''}" onclick="state.filter='${k}';render()">${t(v)}</button>`).join('')}</div><div id="lesson-results">${lessonRows(visible,arts)}</div>${footer()}`}
function lessonRows(ls,arts){return ls.map(l=>`<article class="lesson-row"><span class="path-num">${state.progress.includes(l.id)?'✓':String(lessons.indexOf(l)+1).padStart(2,'0')}</span><div><span class="eyebrow">${t(categories[l.cat])}</span><h3>${t(l.title)}</h3><p>${t(l.desc)}</p></div><button onclick="go('lesson','${l.id}')">${state.progress.includes(l.id)?text('مرور درس','Review'):text('مطالعه','Read')} ↗</button></article>`).join('')+arts.map(a=>`<article class="lesson-row"><span class="path-num">＋</span><div><span class="eyebrow">${text('مقاله آکادمی','Academy article')}</span><h3>${E(t(a.title))}</h3><p>${E(a.category)}</p></div><button onclick="openArticle('${E(a.id)}')">${text('مطالعه','Read')}</button></article>`).join('')+(!ls.length&&!arts.length?`<div class="empty">${text('نتیجه‌ای نیست. عبارت کوتاه‌تر یا دسته دیگری امتحان کن.','No matches. Try a shorter query or another category.')}</div>`:'')}
function filterLessons(q){state.search=q;document.getElementById('lesson-results').innerHTML=lessonRows(lessons.filter(l=>(state.filter==='all'||l.cat===state.filter)&&JSON.stringify(l).toLowerCase().includes(q.toLowerCase())),state.articles.filter(a=>a.published&&!a.id.startsWith('core-')&&JSON.stringify(a).toLowerCase().includes(q.toLowerCase())))}
function lesson(){let l=lessons.find(x=>x.id===state.lesson)||lessons[0];return `<div class="reader"><button class="plain" onclick="go('courses')">${text('→ بازگشت به درس‌ها','← Back to lessons')}</button><header class="reader-header"><span class="eyebrow muted">${t(categories[l.cat])} / ${String(lessons.indexOf(l)+1).padStart(2,'0')}</span><h1>${t(l.title)}</h1><p>${t(l.desc)}</p></header>${l.sections.map(([h,p])=>`<section><h2>${t(h)}</h2><p>${t(p)}</p></section>`).join('')}${l.id==='cim'?codeBox(`| tstats summariesonly=false count
  FROM datamodel=Authentication.Authentication
  WHERE earliest=-60m latest=now
  BY Authentication.src Authentication.user Authentication.dest Authentication.action
| rename Authentication.* AS *`)+`<p class="small muted">${text('پیش‌نیاز: مدل Authentication و نگاشت معتبر CIM؛ با داده خام مقایسه کن.','Requires an Authentication data model and valid CIM mappings; compare with raw data.')}</p>`:''}${l.id==='telemetry'?codeBox(`index=windows earliest=-24h latest=now
| eval ingest_lag=_indextime-_time
| stats count latest(_time) as last_event max(ingest_lag) as max_lag by sourcetype host
| convert ctime(last_event)`):''}${l.ref?`<div class="sources"><a href="${l.ref}" target="_blank" rel="noopener noreferrer">${text('منبع تکمیلی: مستندات Splunk ↗','Further reading: Splunk documentation ↗')}</a></div>`:''}<section class="quiz"><span class="eyebrow muted">KNOWLEDGE CHECK</span><h3>${t(l.question)}</h3><div class="quiz-options">${l.options.map((o,i)=>`<button onclick="answerQuiz('${l.id}',${i})">${t(o)}</button>`).join('')}</div><div class="feedback" id="quiz-feedback" role="status">${state.quizAnswers[l.id]!==undefined?t(l.explain):text('یک گزینه انتخاب کن و دلیل را ببین.','Choose an answer to see the reasoning.')}</div></section><button class="primary" onclick="completeLesson('${l.id}')">${state.progress.includes(l.id)?text('✓ این درس مطالعه شده','✓ Marked as read'):text('ثبت به‌عنوان مطالعه‌شده','Mark as read')}</button> <button onclick="go('lesson','${lessons[(lessons.indexOf(l)+1)%lessons.length].id}')">${text('درس بعدی','Next lesson')}</button><div class="notice">${text('این درس راهنمای آموزشی است؛ اجرای عملی و تصمیم نهایی باید با پلی‌بوک و مجوز سازمان تطبیق داشته باشد.','This lesson is educational. Operational actions and final decisions must follow organizational playbooks and authorization.')}</div></div>`}
function answerQuiz(id,n){const l=lessons.find(x=>x.id===id);state.quizAnswers[id]=n;document.getElementById('quiz-feedback').textContent=(n===l.answer?text('درست است. ','Correct. '):text('دوباره فکر کن. ','Consider it again. '))+t(l.explain)}
async function completeLesson(id){if(!state.progress.includes(id)){let next=[...state.progress,id];if(state.user){try{await api('/api/progress','POST',{progress:next})}catch(e){return toast(e.message)}}else store.set('erm-guest-progress',next);state.progress=next}toast(text('پیشرفت مطالعه ثبت شد.','Reading progress saved.'));render()}
function bookTable(ps){return `<div class="table-wrap"><table><thead><tr><th>${text('هشدار / سناریو','Alert / scenario')}</th><th>${text('حوزه','Domain')}</th><th>${text('شدت نمونه','Example severity')}</th><th>MITRE ATT&CK</th><th>${text('بررسی','Investigate')}</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${t(p.title)}</td><td class="muted">${t(categories[p.cat])}</td><td><span class="pill ${p.severity}"><span class="dot"></span>${p.severity==='high'?text('بالا','High'):text('متوسط','Medium')}</span></td><td class="mono small muted" dir="ltr">${p.mitre}</td><td><button onclick="go('playbook','${p.id}')">${text('باز کردن','Open')} ↗</button></td></tr>`).join('')}</tbody></table></div>`}
function books(){return `${title(text('کتابخانه بررسی هشدار','Investigation playbooks'),text('برای هر هشدار: داده لازم، ترتیب بررسی، شواهد فعالیت مجاز و معیار ارجاع.','For each alert: telemetry, investigation steps, benign evidence and escalation criteria.'))}<div class="notice">${text('شدت‌ها مثال آموزشی‌اند، نه SLA سازمان شما. هیچ پلی‌بوکی تضمین «صددرصد فالس» نمی‌دهد.','Severities are illustrative, not your organizational SLA. No playbook guarantees “100% false positive.”')}</div>${bookTable(playbooks)}${footer()}`}
function codeBox(q){return `<div class="code-box"><div class="code-head"><span>SPL / INVESTIGATION QUERY</span><button onclick="copyCode(this)">${text('کپی SPL','Copy SPL')}</button></div><pre><code>${E(q)}</code></pre></div>`}
async function copyCode(b){const q=b.parentElement.nextElementSibling.textContent;try{await navigator.clipboard.writeText(q);toast(text('SPL کپی شد.','SPL copied.'))}catch{const r=document.createRange();r.selectNodeContents(b.parentElement.nextElementSibling);const s=window.getSelection();s.removeAllRanges();s.addRange(r);toast(text('متن انتخاب شد؛ با Ctrl/Cmd+C کپی کن.','Text selected; use Ctrl/Cmd+C to copy.'))}}
function book(){let p=playbooks.find(x=>x.id===state.playbook)||playbooks[0];return `<button class="plain" onclick="go('playbooks')">${text('→ همه پلی‌بوک‌ها','← All playbooks')}</button><div class="reader-header"><div class="row wrap"><span class="pill ${p.severity}">${p.severity==='high'?text('شدت نمونه: بالا','Example severity: High'):text('شدت نمونه: متوسط','Example severity: Medium')}</span><span class="mono small muted">${p.mitre}</span></div><h1 style="margin-top:16px">${t(p.title)}</h1><p>${t(p.desc)}</p></div><div class="playbook-grid"><article class="reader"><section><h2>${text('داده‌هایی که لازم داری','Telemetry you need')}</h2><p>${t(p.data)}</p></section><section><h2>${text('ترتیب بررسی','Investigation sequence')}</h2>${p.steps.map((s,i)=>`<div class="step"><span class="step-number">${i+1}</span><p>${t(s)}</p></div>`).join('')}</section>${codeBox(p.query)}<p class="small muted">${t(p.contract)}</p><section><h2>${text('چه چیزی فعالیت مجاز را پشتیبانی می‌کند؟','What supports a benign explanation?')}</h2><p>${t(p.benign)}</p></section><section><h2>${text('چه زمانی ارجاع بدهی؟','When should you escalate?')}</h2><p>${t(p.escalate)}</p></section><div class="notice warn">${text('Reputation تمیز، IP داخلی یا تأیید شفاهی کاربر به‌تنهایی مجوز بستن نیست. نبود لاگ حیاتی را به‌عنوان محدودیت ثبت کن.','Clean reputation, an internal IP or a verbal user statement alone does not justify closure. Record material logging gaps as limitations.')}</div>${p.ref?`<a class="small" href="${p.ref}" target="_blank" rel="noopener noreferrer">Splunk Security Content ↗</a>`:''}</article><aside class="sticky-notes"><span class="eyebrow muted">ANALYST WORKSHEET</span><h3 style="margin:12px 0">${text('یادداشت بررسی','Investigation notes')}</h3><p class="small muted">${text('تمرین آموزشی؛ داده محرمانه واقعی وارد نکن. یادداشت مهمان فقط در همین مرورگر ذخیره می‌شود.','Training only; do not enter real confidential data. Guest notes stay in this browser.')}</p><div id="case-checks">${[B('هویت دارایی و کاربر اعتبارسنجی شد','Asset and user validated'),B('زمان و پوشش لاگ بررسی شد','Time and log coverage checked'),B('شواهد مستقل و خط زمانی ثبت شد','Independent evidence and timeline recorded'),B('مالک و تغییر مصوب بررسی شد','Owner and approved change checked')].map((s,i)=>`<label class="check"><input type="checkbox" name="check${i}"><span>${t(s)}</span></label>`).join('')}</div><label for="verdict">${text('نتیجه پیشنهادی','Proposed disposition')}</label><select id="verdict"><option value="inconclusive">${text('شواهد ناکافی / ادامه بررسی','Inconclusive / investigate further')}</option><option value="escalate">${text('ارجاع به Tier 2','Escalate to Tier 2')}</option><option value="btp">Benign True Positive</option><option value="fp">False Positive</option></select><label for="notes">${text('شواهد، محدودیت‌ها و اقدام بعدی','Evidence, gaps and next action')}</label><textarea id="notes" placeholder="${text('چه اتفاقی افتاد؟ کدام شواهد پشتیبانی می‌کنند؟ چه چیز نامعلوم است؟','What happened? What evidence supports it? What remains unknown?')}"></textarea><button class="primary" style="width:100%;margin-top:16px" onclick="saveCase('${p.id}')">${text('ذخیره یادداشت','Save notes')}</button><button style="width:100%;margin-top:8px" onclick="exportCase('${p.id}')">${text('دانلود گزارش Markdown','Download Markdown report')}</button><div class="feedback" id="case-status" role="status"></div></aside></div>`}
function caseData(){return {checks:[...document.querySelectorAll('#case-checks input')].map(x=>x.checked),verdict:document.getElementById('verdict').value,notes:document.getElementById('notes').value}}
async function loadCase(id){let data;if(state.user){try{data=(await api('/api/notes/'+id)).note}catch{return}}else data=store.get('erm-case-'+id,null);if(!data||state.page!=='playbook'||state.playbook!==id)return;document.getElementById('notes').value=data.notes||'';document.getElementById('verdict').value=data.verdict||'inconclusive';document.querySelectorAll('#case-checks input').forEach((x,i)=>x.checked=!!data.checks?.[i])}
async function saveCase(id){let d=caseData();if(d.notes.trim().length<20)return toast(text('حداقل ۲۰ نویسه درباره شواهد و محدودیت‌ها بنویس.','Write at least 20 characters about evidence and limitations.'));if((d.verdict==='fp'||d.verdict==='btp')&&!d.checks.every(Boolean))return toast(text('برای پیشنهاد بستن، چک‌های بررسی را کامل کن؛ چک‌زدن به‌تنهایی اثبات نیست.','Complete the review checks before proposing closure; checks alone are not proof.'));try{if(state.user)await api('/api/notes/'+id,'POST',d);else store.set('erm-case-'+id,d);document.getElementById('case-status').textContent=text('یادداشت ذخیره شد؛ این کار هیچ هشدار واقعی را نمی‌بندد.','Notes saved. This does not close any real alert.')}catch(e){toast(e.message)}}
function download(name,content,type='text/plain'){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCase(id){let d=caseData(),p=playbooks.find(x=>x.id===id);download('soc-'+id+'.md',`# TRAINING CASE: ${t(p.title)}\n\nExported: ${new Date().toISOString()}\nSynthetic practice, not an operational verdict.\n\nDisposition: ${d.verdict}\nChecks: ${d.checks.map((x,i)=>`${i+1}=${x}`).join(', ')}\n\n## Evidence, coverage and next action\n${d.notes}\n\n## SPL reference (adapt schema and absolute time bounds)\n\`\`\`spl\n${p.query}\n\`\`\`\n`,'text/markdown')}

کن','Correlate source process, domain and baseline')],answer:1,explain:B('طول و تعداد فقط غربال اولیه‌اند. ابزارهای مجاز هم ممکن است چنین الگوهایی داشته باشند.','Length and volume are screening signals. Authorized applications may produce these patterns.')},{p:'egress',headers:['_time (UTC)','src','dest','users','sent_mb'],rows:[['2026-09-01T02:00:00Z','192.0.2.30','backup.example','svc_backup',1840],['2026-09-01T12:00:00Z','192.0.2.23','upload.example','analyst',720]],question:B('نام backup.example برای بستن کافی است؟','Is the name backup.example enough for closure?'),choices:[B('خیر؛ مالکیت مقصد، برنامه و change را تأیید کن','No; verify destination ownership, application and change'),B('بله؛ اسم آن backup است','Yes; the name says backup')],answer:0,explain:B('نام دامنه مدرک مالکیت نیست. داده نمونه از دامنه‌ها و IPهای رزروشده استفاده می‌کند.','A domain name does not prove ownership. This sample uses reserved example domains and IP addresses.')}];
function lab(){let s=samples[state.lab],p=playbooks.find(x=>x.id===s.p);return `${title(text('آزمایشگاه SPL','SPL investigation lab'),text('بخوان، خروجی نمونه را تفسیر کن و قدم بعدی را انتخاب کن.','Read a query, interpret its sample output and choose your next pivot.'))}<div class="notice">${text('این محیط موتور Splunk نیست و SPL دلخواه اجرا نمی‌کند. خروجی‌ها نمونه ثابت و ساختگی‌اند؛ برای اجرای واقعی، query را پس از تطبیق schema در Splunk خودت اجرا کن.','This is not a Splunk engine and does not execute arbitrary SPL. Outputs are fixed synthetic samples. Adapt the schema and run copied queries in your own Splunk environment.')}</div><div class="lab-layout"><aside class="scenario-nav">${samples.map((s,i)=>`<button class="${state.lab===i?'active':''}" onclick="state.lab=${i};render()"><span class="mono muted">0${i+1}</span> ${t(playbooks.find(p=>p.id===s.p).title)}</button>`).join('')}</aside><section><div class="row between wrap"><h2>${t(p.title)}</h2><span class="pill">SYNTHETIC DATA</span></div>${codeBox(p.query)}<p class="small muted">${t(p.contract)}</p><button class="primary" onclick="showSample()">▷ ${text('نمایش خروجی نمونه','Show sample output')}</button><div id="sample-output" class="hide" style="margin-top:24px"><span class="eyebrow muted">STATIC SAMPLE / ${s.rows.length} ROWS</span><div class="table-wrap" dir="ltr"><table><thead><tr>${s.headers.map(h=>`<th>${E(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(c=>`<td class="mono small">${E(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><section class="quiz"><h3>${t(s.question)}</h3><div class="quiz-options">${s.choices.map((c,i)=>`<button onclick="labAnswer(${i})">${t(c)}</button>`).join('')}</div><div class="feedback" id="lab-feedback" role="status"></div></section><button onclick="go('playbook','${p.id}')">${text('ادامه در پلی‌بوک و ثبت گزارش','Continue to the playbook & write a report')} ↗</button></div></section></div>${footer()}`}
function showSample(){document.getElementById('sample-output').classList.remove('hide')}
function labAnswer(i){const s=samples[state.lab];document.getElementById('lab-feedback').textContent=(i===s.answer?text('انتخاب درست. ','Good choice. '):text('این نتیجه هنوز پشتیبانی نمی‌شود. ','That conclusion is not supported yet. '))+t(s.explain)}
function terms(){return `${title(text('واژه‌نامه تحلیلگر','The analyst’s glossary'),text('اصطلاحات کوتاه، با معنایی که در بررسی لازم داری.','Concise definitions for real investigation reasoning.'))}<input class="search-wide" aria-label="${text('جست‌وجوی واژه','Search glossary')}" placeholder="${text('جست‌وجوی اصطلاح…','Find a term…')}" oninput="filterTerms(this.value)"><div class="glossary mt" id="terms">${termRows(glossary)}</div>${footer()}`}
function termRows(gs){return gs.length?gs.map(([h,d])=>`<article><h3 dir="ltr">${h}</h3><p>${t(d)}</p></article>`).join(''):`<div class="empty">${text('اصطلاحی پیدا نشد.','No matching terms.')}</div>`}
function filterTerms(q){document.getElementById('terms').innerHTML=termRows(glossary.filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase())))}
async function api(path,method='GET',body){let r;try{r=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-Ermanian-Request':'1'},body:body?JSON.stringify(body):undefined})}catch{throw Error(text('ارتباط با سرور برقرار نشد.','Could not reach the server.'))}let d;try{d=await r.json()}catch{throw Error(text('بک‌اند این پیش‌نمایش فعال نیست؛ پروژه کامل را محلی اجرا کن.','The backend is not active in this preview; run the full project locally.'))}if(!r.ok)throw Error(state.lang==='fa'?(d.error_fa||d.error):d.error);return d}
function auth(){const reg=state.auth==='register';return `<div class="auth-layout"><aside class="auth-copy"><span class="eyebrow">ERMANIAN / MEMBERS</span><div><h2>${text('یادگیری جدی،<br>جمع کوچک.','Serious learning.<br>A focused circle.')}</h2><p>${text('عضویت دعوتی برای تحلیلگرهایی که می‌خواهند از حدس به بررسی مستند برسند.','An invite-only academy for analysts moving from assumptions to documented investigation.')}</p></div><span class="small">ENDPOINT · NETWORK · SPLUNK</span></aside><section class="auth-form"><h1>${reg?text('به آکادمی بپیوند','Join the academy'):text('خوش برگشتی','Welcome back')}</h1><p class="muted small">${reg?text('ثبت‌نام فقط با کد دعوت معتبر انجام می‌شود.','Registration requires a valid invitation code.'):text('برای ذخیره پیشرفت و یادداشت‌ها وارد شو.','Sign in to sync your progress and notes.')}</p><div class="tabs"><button class="${!reg?'active':''}" onclick="state.auth='login';render()">${text('ورود','Sign in')}</button><button class="${reg?'active':''}" onclick="state.auth='register';render()">${text('ثبت‌نام دعوتی','Join with invite')}</button></div>${!state.online?`<div class="notice warn">${text('این فایل پیش‌نمایش است. ثبت‌نام و ورود واقعی فقط هنگام اجرای بک‌اند پروژه کار می‌کند؛ اینجا حساب یا رمز ذخیره نمی‌شود.','This file is a preview. Real registration and login require the project backend; no accounts or passwords are stored here.')}</div>`:''}<form id="auth-form">${reg?`<label for="name">${text('نام نمایشی','Display name')}</label><input id="name" name="name" required maxlength="80" autocomplete="name">`:''}<label for="email">${text('ایمیل','Email')}</label><input id="email" name="email" type="email" required maxlength="254" dir="ltr" autocomplete="username"><label for="password">${text('رمز عبور','Password')}</label><input id="password" name="password" type="password" required minlength="12" maxlength="128" dir="ltr" autocomplete="${reg?'new-password':'current-password'}"><div class="small muted">${text('حداقل ۱۲ نویسه؛ از رمز یکتا استفاده کن.','At least 12 characters; use a unique password.')}</div>${reg?`<label for="invite">${text('کد دعوت','Invitation code')}</label><input id="invite" name="invite" required dir="ltr" autocomplete="off"><label for="setup">${text('کلید راه‌اندازی مالک (فقط اولین عضو)','Owner setup key (first member only)')}</label><input id="setup" name="setup_key" type="password" dir="ltr" autocomplete="off"><div class="small muted">${text('اولین عضو سوپرادمین می‌شود. برای جلوگیری از تصاحب سایت، کلید یک‌بار راه‌اندازی را از ترمینال سرور بردار؛ اعضای بعدی خالی بگذارند.','The first member becomes superadmin. To prevent ownership takeover, use the server terminal setup key; subsequent members leave this blank.')}</div>`:''}<button class="primary" ${!state.online?'disabled':''} type="submit">${reg?text('ساخت حساب','Create account'):text('ورود به آکادمی','Sign in')}</button><div id="auth-status" role="status" class="feedback"></div></form><button class="plain" style="margin-top:16px" onclick="go('home')">${text('ادامه به‌عنوان مهمان','Continue as a guest')}</button></section></div>`}
async function authSubmit(e){e.preventDefault();const b=e.target.querySelector('button[type=submit]');b.disabled=true;document.getElementById('auth-status').textContent=text('در حال بررسی…','Checking…');try{let data=Object.fromEntries(new FormData(e.target));let d=await api('/api/'+state.auth,'POST',data);state.user=d.user;await sync();toast(text('وارد شدی.','Signed in.'));go('home')}catch(x){document.getElementById('auth-status').textContent=x.message;b.disabled=false}}
async function logout(){try{await api('/api/logout','POST',{});state.user=null;state.users=[];state.audit=[];state.progress=store.get('erm-guest-progress',[]);await sync();go('home')}catch(e){toast(e.message)}}
function admin(){if(!state.user||!['superadmin','editor'].includes(state.user.role))return `${title(text('پنل مدیریت','Administration'),text('مدیریت محتوا، اعضا و گزارش فعالیت‌ها.','Manage content, members and activity records.'))}<div class="empty"><h2>${text('این بخش به دسترسی مدیریتی نیاز دارد','Administrative access required')}</h2><p style="margin:16px auto">${text('اولین حساب در بک‌اند با کد دعوت و کلید راه‌اندازی، سوپرادمین می‌شود. کنترل دسترسی در سرور انجام می‌شود؛ تغییر ظاهر صفحه دسترسی ایجاد نمی‌کند.','The first backend account becomes superadmin using the invite code and setup key. Access is enforced on the server; changing the UI does not grant permissions.')}</p><button class="primary" onclick="go('auth')">${text('ورود به حساب','Sign in')}</button> <button onclick="go('sources')">${text('راهنمای راه‌اندازی','Setup guide')}</button></div>`;
return `${title(text('مدیریت آکادمی','Academy administration'),text('محتوا را توسعه بده؛ دسترسی‌ها را مشخص و قابل پیگیری نگه دار.','Develop the curriculum. Keep access explicit and accountable.'))}<div class="tabs">${['articles',...(state.user.role==='superadmin'?['users','audit','settings']:[])].map(k=>`<button class="${state.tab===k?'active':''}" onclick="state.tab='${k}';loadAdmin()">${t({articles:B('مقاله‌ها','Articles'),users:B('کاربران','Users'),audit:B('گزارش فعالیت','Audit log'),settings:B('تنظیمات','Settings')}[k])}</button>`).join('')}</div>${state.tab==='articles'?adminArticles():state.tab==='users'?adminUsers():state.tab==='audit'?adminAudit():adminSettings()}`}
function adminArticles(){let a=state.draft;return `<div class="admin-layout"><section><h2>${a?text('ویرایش مقاله','Edit article'):text('مقاله تازه','New article')}</h2><p class="small muted">${text('متن ساده ذخیره می‌شود؛ HTML و اسکریپت اجرا نمی‌شوند. مقاله منتشرشده در مسیر یادگیری دیده می‌شود. برای ویرایش درس‌های پایه ابتدا آن‌ها را وارد مدیریت کن.','Content is stored as plain text; HTML and scripts are not executed. Published articles appear in the learning path. Import core lessons into management before editing them.')}</p><form id="article-form"><input type="hidden" name="id" value="${E(a?.id||'')}"><label for="title_fa">عنوان فارسی</label><input id="title_fa" name="title_fa" required maxlength="200" dir="rtl" value="${E(a?.title.fa||'')}"><label for="title_en">English title</label><input id="title_en" name="title_en" required maxlength="200" dir="ltr" value="${E(a?.title.en||'')}"><label for="body_fa">متن فارسی</label><textarea id="body_fa" name="body_fa" required dir="rtl" style="min-height:220px">${E(a?.body.fa||'')}</textarea><label for="body_en">English content</label><textarea id="body_en" name="body_en" required dir="ltr" style="min-height:220px">${E(a?.body.en||'')}</textarea><label for="category">${text('دسته‌بندی','Category')}</label><input id="category" name="category" maxlength="80" value="${E(a?.category||'SOC')}"><label class="check"><input type="checkbox" name="published" ${a?.published?'checked':''}><span>${text('انتشار برای اعضا و مهمان‌ها','Publish for members and guests')}</span></label><button type="submit" class="primary">${text('ذخیره مقاله','Save article')}</button> <button type="button" onclick="state.draft=null;render()">${text('فرم تازه','New form')}</button><div class="feedback" id="article-status" role="status"></div></form></section><aside><h3>${text('محتوای قابل ویرایش','Editable content')}</h3>${state.articles.length?state.articles.map(a=>`<div style="padding:16px 0;border-bottom:1px solid var(--line)"><strong class="small">${E(t(a.title))}</strong><div class="small muted">${a.published?text('منتشرشده','Published'):text('پیش‌نویس','Draft')}</div><button class="small" onclick="editArticle('${E(a.id)}')">${text('ویرایش','Edit')}</button></div>`).join(''):`<p class="small muted">${text('هنوز مقاله‌ای اضافه نشده است.','No articles added yet.')}</p>`}<h3 class="mt">${text('ویرایش درس پایه','Edit a core lesson')}</h3><label for="core-lesson">${text('انتخاب درس','Choose lesson')}</label><select id="core-lesson">${lessons.map(l=>`<option value="${l.id}">${t(l.title)}</option>`).join('')}</select><button style="margin-top:12px" onclick="importLesson()">${text('باز کردن در ویرایشگر','Open in editor')}</button><p class="small muted">${text('نسخه ویرایش‌شده با انتشار جای متن درس پایه را می‌گیرد؛ آزمون پایه بدون تغییر می‌ماند.','Publishing an edited version replaces the core lesson text; its original quiz remains unchanged.')}</p></aside></div>`}
function importLesson(){let l=lessons.find(l=>l.id===document.getElementById('core-lesson').value);state.draft={id:'core-'+l.id,title:l.title,body:B(l.sections.map(([h,p])=>h.fa+'\n'+p.fa).join('\n\n'),l.sections.map(([h,p])=>h.en+'\n'+p.en).join('\n\n')),category:l.cat,published:true};render()}
function editArticle(id){state.draft=state.articles.find(a=>a.id===id);render();window.scrollTo(0,0)}
async function articleSubmit(e){e.preventDefault();let b=e.target.querySelector('button[type=submit]');b.disabled=true;let d=Object.fromEntries(new FormData(e.target));d.published=!!d.published;try{await api('/api/articles','POST',d);state.draft=null;await sync();render();toast(text('مقاله ذخیره شد.','Article saved.'))}catch(x){document.getElementById('article-status').textContent=x.message;b.disabled=false}}
function adminUsers(){return `<p class="small muted">${text('سوپرادمین اصلی قابل تنزل یا غیرفعال‌سازی نیست. تغییر نقش و وضعیت، نشست‌های فعال کاربر را باطل می‌کند. رمزهای عبور قابل مشاهده نیستند.','The owner superadmin cannot be demoted or disabled. Role/status changes revoke the member’s active sessions. Passwords are never visible.')}</p><div class="table-wrap"><table><thead><tr><th>${text('نام / ایمیل','Name / email')}</th><th>${text('نقش','Role')}</th><th>${text('وضعیت','Status')}</th><th>${text('مطالعه','Read')}</th><th>${text('ثبت','Save')}</th></tr></thead><tbody>${state.users.map(u=>`<tr><td>${E(u.name)}<div class="small muted" dir="ltr">${E(u.email)}</div></td><td><select aria-label="Role for ${E(u.name)}" id="role-${u.id}" ${u.role==='superadmin'?'disabled':''}>${(u.role==='superadmin'?['superadmin']:['member','editor']).map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></td><td><select aria-label="Status for ${E(u.name)}" id="active-${u.id}" ${u.role==='superadmin'?'disabled':''}><option value="1" ${u.active?'selected':''}>${text('فعال','Active')}</option><option value="0" ${!u.active?'selected':''}>${text('غیرفعال','Disabled')}</option></select></td><td class="mono">${u.progress_count}/30</td><td><button onclick="updateUser(${u.id})" ${u.role==='superadmin'?'disabled':''}>${text('ذخیره','Save')}</button><button style="margin-inline-start:4px" onclick="inspectUser(${u.id})">${text('یادداشت‌ها','Notes')}</button></td></tr>`).join('')}</tbody></table></div><section id="user-notes" class="mt"></section>`}
async function updateUser(id){let role=document.getElementById('role-'+id).value,active=document.getElementById('active-'+id).value==='1';if(!confirm(text('نقش یا وضعیت این عضو تغییر کند؟ نشست‌های او باطل خواهند شد.','Apply member role/status changes? Their sessions will be revoked.')))return;try{await api('/api/users/'+id,'POST',{role,active});await loadAdmin();toast(text('دسترسی عضو به‌روز شد.','Member access updated.'))}catch(e){toast(e.message)}}
async function inspectUser(id){try{let d=await api('/api/users/'+id+'/notes');document.getElementById('user-notes').innerHTML=`<h3>${text('یادداشت‌های آموزشی عضو','Member training notes')}</h3>${d.notes.length?d.notes.map(n=>`<div class="notice"><strong>${E(n.case_id)}</strong><p>${E(n.data.notes)}</p><span class="small muted">${E(n.data.verdict)}</span></div>`).join(''):`<p class="muted">${text('یادداشتی ثبت نشده است.','No notes saved.')}</p>`}`}catch(e){toast(e.message)}}
function adminAudit(){return `<p class="small muted">${text('۱۰۰ فعالیت اخیر: ورود، محتوا، تغییر دسترسی و مطالعه. این گزارش آموزشی، سامانه ضد‌دستکاری جرم‌یابی نیست.','Latest 100 recorded activities: sign-ins, content, access changes and learning. This is not a tamper-evident forensic audit system.')}</p><div class="table-wrap"><table><thead><tr><th>UTC</th><th>${text('عامل','Actor')}</th><th>${text('فعالیت','Action')}</th><th>${text('هدف','Target')}</th></tr></thead><tbody>${state.audit.map(a=>`<tr><td class="mono small">${E(a.created)}</td><td>${E(a.actor)}</td><td>${E(a.action)}</td><td>${E(a.target)}</td></tr>`).join('')}</tbody></table></div>`}
function adminSettings(){return `<div class="reader"><h2>${text('ثبت‌نام دعوتی','Invite-only registration')}</h2><p>${text('کد اولیه ermanian در سرور بررسی می‌شود. این کد مشترک است؛ هر کسی که آن را بداند می‌تواند عضو شود. برای محدودسازی بهتر، کد را دوره‌ای عوض کن یا ثبت‌نام را ببند.','The initial ermanian code is checked on the server. It is shared: anyone who knows it can register. Rotate it periodically or close registration to restrict access.')}</p><form id="settings-form"><label for="new-invite">${text('کد دعوت تازه (حداقل ۸ نویسه)','New invitation code (at least 8 characters)')}</label><input id="new-invite" name="invite_code" type="password" minlength="8" maxlength="128" autocomplete="new-password"><label class="check"><input type="checkbox" name="registration_open" ${state.registrationOpen?'checked':''}><span>${text('ثبت‌نام باز باشد','Allow registration')}</span></label><button class="primary" type="submit">${text('ذخیره تنظیمات','Save settings')}</button><div id="settings-status" class="feedback" role="status"></div></form><div class="notice">${text('مدیر می‌تواند نقش، وضعیت و محتوای آموزشی را ویرایش و یادداشت‌ها و فعالیت‌های اعضا را ببیند. رمزها، session secret و invite فعلی از API نمایش داده نمی‌شوند.','Administrators can edit roles, status and learning content and inspect member notes/activity. Passwords, session secrets and the current invite are not exposed by the API.')}</div></div>`}
async function settingsSubmit(e){e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{let d=Object.fromEntries(new FormData(e.target));d.registration_open=!!d.registration_open;await api('/api/settings','POST',d);await loadAdmin();toast(text('تنظیمات ذخیره شد.','Settings saved.'))}catch(x){document.getElementById('settings-status').textContent=x.message;b.disabled=false}}
async function loadAdmin(){try{await sync();if(state.user?.role==='superadmin'){let [u,a,s]=await Promise.all([api('/api/users'),api('/api/audit'),api('/api/settings')]);state.users=u.users;state.audit=a.audit;state.registrationOpen=s.registration_open}render()}catch(e){toast(e.message)}}
function openArticle(id){state.articleId=id;go('article')}
function article(){let a=state.articles.find(a=>a.id===state.articleId);return a?`<article class="reader"><button class="plain" onclick="go('courses')">${text('→ مسیر یادگیری','← Learning path')}</button><header class="reader-header"><span class="eyebrow muted">${E(a.category)}</span><h1>${E(t(a.title))}</h1></header>${E(t(a.body)).split(/\n\n+/).map(p=>`<p style="white-space:pre-wrap">${p}</p>`).join('')}</article>`:`<div class="empty">${text('مقاله در دسترس نیست.','Article unavailable.')}</div>`}
function sources(){return `${title(text('منابع و راه‌اندازی','Sources & setup'),text('مرز بین آموزش، شبیه‌سازی و سامانه عملیاتی را روشن نگه دار.','Keep learning, simulation and operational systems clearly separated.'))}<article class="reader"><section><h2>${text('این نسخه چه دارد؟','What this edition includes')}</h2><p>${text('۱۴ درس دوزبانه، ۸ پلی‌بوک، ۴ تمرین خروجی SPL، واژه‌نامه، آزمون کوتاه و یادداشت پرونده. رابط فارسی با Vazirmatn، راست‌به‌چپ و تم تاریک پیش‌فرض طراحی شده است. خواندن آموزش‌ها برای مهمان باز است؛ ذخیره سروری و مدیریت نیازمند ورود است.','14 bilingual lessons, 8 playbooks, 4 SPL-output exercises, a glossary, knowledge checks and case notes. Persian uses Vazirmatn and RTL layout, with dark mode as default. Guests can read lessons; server-synced storage and administration require sign-in.')}</p></section><section><h2>${text('اجرای پروژه کامل','Run the full project')}</h2><p>${text('پیش‌نمایش HTML به‌تنهایی بک‌اند ندارد. در بسته پروژه، Python 3.12 یا جدیدتر لازم است؛ داخل پوشه پروژه دستور زیر را اجرا کن و آدرس محلی چاپ‌شده را باز کن. نخستین ثبت‌نام با کد دعوت ermanian و کلید setup چاپ‌شده در ترمینال، سوپرادمین می‌شود.','The HTML preview has no backend by itself. The project package requires Python 3.12 or newer. Run the command below from its folder and open the printed local URL. The first registration using invite ermanian and the terminal’s setup key becomes superadmin.')}</p>${codeBox('python server.py')}<p>${text('داده‌ها در SQLite سمت سرور نگهداری می‌شوند. نقش‌ها، دعوت، هش رمز، نشست و کنترل دسترسی در سرور بررسی می‌شوند. این بسته یک پایه قابل‌اجرای محلی است، نه سرویس از قبل منتشرشده یا محصول ممیزی‌شده برای محیط production.','Data is stored in server-side SQLite. Roles, invitations, password hashes, sessions and authorization are enforced by the server. This is a runnable local foundation, not an already-hosted service or a production-audited product.')}</p></section><section><h2>${text('پیش از انتشار عمومی','Before public deployment')}</h2><p>${text('از سرور توسعه مستقیماً روی اینترنت استفاده نکن. استقرار پشت HTTPS و reverse proxy معتبر، Cookie امن، دامنه و Origin مشخص، پشتیبان‌گیری، بازیابی رمز، MFA، محدودسازی درخواست توزیع‌شده، پایش و بازبینی امنیتی لازم است. کد دعوت ثابت محرمانگی دائمی ایجاد نمی‌کند و مهاجمِ دارای آن می‌تواند ثبت‌نام کند.','Do not expose the development server directly to the internet. Public deployment needs HTTPS and a trusted reverse proxy, secure cookies, explicit origin, backups, password recovery, MFA, distributed rate limits, monitoring and security review. A static invitation code is not permanent secrecy; anyone holding it can register.')}</p></section><section><h2>${text('SPL و منابع آموزشی','SPL and learning references')}</h2><p>${text('SPLها مثال‌های تألیفی آموزشی‌اند، در Splunk واقعی این پروژه اجرا یا اعتبارسنجی نشده‌اند. index، sourcetype، extraction، نسخه Add-on و زمان را با محیط خود تطبیق بده. منبع زیر درباره تحلیل PowerShell، DNS و پوشش tstats استفاده شده است؛ باقی مطالب توضیح آموزشی عمومی‌اند و جای SOP سازمان نیستند.','SPL examples are authored teaching queries, not executed or validated against a live Splunk instance in this project. Adapt indexes, sourcetypes, extractions, add-on versions and time bounds. The following references inform PowerShell, DNS and tstats coverage; other explanations are general education, not your organization’s SOP.')}</p><div class="sources"><a href="${refs.powershell}" target="_blank" rel="noopener noreferrer">Splunk Security Content: Malicious PowerShell ↗</a><a href="${refs.dns}" target="_blank" rel="noopener noreferrer">Splunk Security Content: Suspicious DNS Traffic ↗</a><a href="${refs.tstats}" target="_blank" rel="noopener noreferrer">Splunk Search Reference: tstats ↗</a></div></section><section><h2>${text('حریم خصوصی اعضا','Member privacy')}</h2><p>${text('سوپرادمین می‌تواند ایمیل، نقش، وضعیت، پیشرفت، یادداشت‌های تمرینی و گزارش فعالیت اعضا را ببیند. رمز عبور قابل مشاهده نیست. داده محرمانه سازمان، لاگ واقعی حاوی اطلاعات شخصی و IOC حساس را بدون مجوز وارد نکن. فونت از Google Fonts دریافت می‌شود و در صورت عدم دسترسی فونت سیستمی جایگزین می‌شود.','The superadmin can inspect member email, role, status, progress, training notes and activity records. Passwords are not viewable. Do not enter confidential organizational data, personal logs or sensitive indicators without authorization. Fonts load from Google Fonts with system fallback when unavailable.')}</p></section></article>${footer()}`}
function bindForms(){document.getElementById('auth-form')?.addEventListener('submit',authSubmit);document.getElementById('article-form')?.addEventListener('submit',articleSubmit);document.getElementById('settings-form')?.addEventListener('submit',settingsSubmit);if(state.page==='playbook')loadCase(state.playbook);if(state.page==='lesson'){let a=state.articles.find(a=>a.id==='core-'+state.lesson&&a.published);if(a){const el=document.querySelector('.reader');el.querySelector('h1').textContent=t(a.title);const sections=el.querySelectorAll(':scope > section:not(.quiz)');sections.forEach(x=>x.remove());let block=document.createElement('section');block.innerHTML=E(t(a.body)).split(/\n\n+/).map(p=>`<p style="white-space:pre-wrap">${p}</p>`).join('');el.querySelector('.reader-header').after(block)}}}
