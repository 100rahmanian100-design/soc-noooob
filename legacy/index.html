],'rename کردن host به host.name کافی است؟||Is renaming host to host.name sufficient?',['نه؛ معنا و mapping باید تأیید شوند||No; validate semantics and mapping','بله، نام استاندارد کافی است||Yes, standard names suffice'],0,'هم‌معنایی مهم‌تر از هم‌نامی است.||Semantic equivalence matters more than matching names.',['sysmon','eeql','ststats']);
chapter('kql','elastic','KQL برای تریاژ سریع||KQL for fast triage',[
'Kibana Query Language فقط سند را فیلتر می‌کند؛ stats، sort یا sequence ندارد. آن را با Microsoft Kusto Query Language که مخفف یکسان دارد اشتباه نگیر. data view و بازه زمان در UI/API جدا تنظیم می‌شوند.||Kibana Query Language only filters documents; it has no stats, sort or sequence. It differs from Microsoft Kusto despite the shared abbreviation. Configure data view and time bounds separately in the UI/API.',
'field:* وجود مقدار indexed را می‌سنجد نه معتبر بودن آن را. keyword عموماً exact و حساس به حروف است؛ text تحلیل می‌شود. برای AND/OR پرانتز بگذار و با raw مقایسه کن. leading wildcard ممکن است با تنظیم محیط محدود شده باشد.||field:* checks indexed-value existence, not validity. Keywords generally match exactly and case-sensitively; text is analyzed. Parenthesize AND/OR and compare raw events. Environment settings may restrict leading wildcards.',
'از source/category شروع کن، سپس entity و outcome را اضافه کن. failure filter را brute-force detector ننام؛ شمارش و آستانه قانون باید جدا تعریف شوند. نمونه عملی: event.category:authentication and event.outcome:failure را در بازه محدود بررسی و user/source را دستی اعتبارسنجی کن.||Start with source/category, then add entity/outcome. A failure filter is not a brute-force detector; counts and thresholds are separate. Practice with an authentication-failure filter in a bounded window and verify users/sources.'
],'برای شمارش شکست‌ها بر اساس user چه لازم است؟||What is needed to count failures by user?',['فقط KQL||Only KQL','aggregation یا threshold جدا||Separate aggregation/threshold'],1,'فیلتر سند با تشخیص الگوی حجمی فرق دارد.||Filtering documents differs from detecting volume patterns.',['ekql']);
chapter('eql','elastic','EQL و توالی رویداد||EQL event sequences',[
'sequence رویدادها را با ترتیب مشخص توصیف می‌کند. host مشترک به معنی process مشترک نیست؛ برای دانلود و اجرا entityهای درست و timestamp معتبر لازم‌اند. رویدادهای پیش‌فرض EQL از event.category و @timestamp استفاده می‌کنند.||Sequences express ordered events. Shared hosts do not establish shared processes; use valid entities/timestamps for download/execution. EQL defaults to event.category and @timestamp.',
'join key و maxspan را بر اساس رفتار انتخاب کن. process.entity_id خالی ممکن است join نشود. maxspan با look-back و فاصله اجرای قانون متفاوت است؛ یکی مدت زنجیره، یکی بازه search و دیگری schedule است.||Choose join keys/maxspan for the behavior. Missing process.entity_id can prevent joins. Maxspan, look-back and schedule interval respectively describe sequence duration, search window and run frequency.',
'fixture با رویداد دیررس، timestamp یکسان، GUID متفاوت و رویداد گمشده بساز. tiebreaker معتبر برای زمان برابر لازم است. sequence مطابق query هم علیت را به‌تنهایی ثابت نمی‌کند؛ parent/child و محتوای رفتار را بررسی کن.||Test delayed events, equal timestamps, different GUIDs and missing events. Equal timestamps need valid tiebreakers. Matching sequences alone do not establish causality; inspect lineage and behavior.'
],'دو event روی یک host یک process هستند؟||Are two same-host events one process?',['نه؛ identity و زمان باید پیوند معتبر داشته باشند||No; identity and timing need valid joins','بله||Yes'],0,'join ضعیف زنجیره حمله کاذب می‌سازد.||Weak joins create spurious attack chains.',['eeql']);
chapter('esql','elastic','ES|QL برای تحلیل و aggregation||ES|QL analytics',[
'ES|QL با FROM شروع و با WHERE، EVAL، STATS و SORT داده را تبدیل می‌کند. این زبان EQL نیست؛ sequence با syntax EQL را نمی‌توان در آن چسباند. امکانات با نسخه تغییر می‌کنند، پس مرجع نسخه نصب‌شده را بخوان.||ES|QL starts with FROM and transforms through WHERE, EVAL, STATS and SORT. It is not EQL; EQL sequence syntax is not interchangeable. Capabilities vary by version.',
'پس از STATS فقط گروه‌ها و aggregate باقی می‌مانند؛ host/user لازم برای triage را آگاهانه نگه دار. count سند برابر رخداد واقعی نیست اگر duplicate یا split event داری. بازه زمان، missing fields و sample size را کنار آمار ثبت کن.||After STATS only groups/aggregates remain; deliberately retain triage entities. Document counts may differ from events under duplication/splitting. Report time bounds, missing fields and sample size.',
'تمرین: روی داده آزمایشگاهی ابتدا FROM و LIMIT، سپس WHERE و نهایتاً STATS بنویس. پس از هر مرحله شمارش و schema را مقایسه کن. نتیجه aggregate برای alert به schedule، تست و suppression مستقل نیاز دارد.||Practice on lab data: start with FROM/LIMIT, add WHERE, then STATS. Compare counts/schema at each stage. Alerting on aggregates requires separate scheduling, testing and suppression.'
],'EQL و ES|QL یک زبان هستند؟||Are EQL and ES|QL the same?',['بله||Yes','نه، هدف و syntax متفاوت است||No, different purposes and syntax'],1,'EQL الگوی رویداد و ES|QL pipeline تحلیلی است.||EQL models event patterns; ES|QL provides analytical pipelines.',['eesql']);
chapter('rulelife','elastic','چرخه عمر قانون تشخیص||Detection lifecycle',[
'با رفتار هدف، دلیل تهدید، source و field لازم شروع کن. query، severity، threshold و schedule را جدا مستند کن. MITRE mapping طبقه‌بندی است؛ یک T-ID به معنی تشخیص تمام آن تکنیک نیست.||Start with target behavior, rationale, sources and required fields. Document queries, severities, thresholds and schedules separately. A MITRE T-ID classifies behavior, not full technique coverage.',
'تست مثبت، منفی، BTP، missing-field، delayed، duplicate و window boundary بساز. مثبت یعنی predicate هدف دیده شد، نه الزاماً malware. syntax، مصرف منابع و حجم مشابه تولید را جدا بسنج. برای استثنا owner و expiry لازم است.||Test positives, negatives, BTPs, missing fields, delay, duplicates and boundaries. Positive means predicate match, not necessarily malware. Validate syntax/load independently; exceptions need owners/expiry.',
'با shadow mode شروع، خروجی را با analyst review و سپس rollout محدود منتشر کن. version، rollback و معیار کیفیت را ثبت کن. پس از parser/integration change، regression را تکرار کن. هیچ query این بسته روی SIEM واقعی اجرا نشده است.||Start in shadow mode, review analyst output, then roll out narrowly. Record version, rollback and quality metrics. Repeat regressions after parser/integration changes. No package query was executed on a live SIEM.'
],'یک fixture مثبت برای production کافی است؟||Is one positive fixture sufficient for production?',['نه، منفی‌ها و schema و بار و rollout لازم‌اند||No; negatives, schema, load and rollout matter','بله||Yes'],0,'تست محلی فقط همان نمونه و قرارداد را تأیید می‌کند.||Local tests only validate those examples/contracts.',['escript','eeql']);
chapter('tuning','elastic','تنظیم هشدار بدون ازدست‌دادن دید||Tuning without losing visibility',[
'خروجی را به FP، BTP، inconclusive و malicious طبق taxonomy سازمان تقسیم کن. قانون پرحجم شاید حمله واقعی، rollout نرم‌افزار یا خرابی parser را نشان دهد. کاهش تعداد alert به‌خودی‌خود بهبود کیفیت نیست.||Classify FP/BTP/inconclusive/malicious under organizational taxonomy. Volume may reflect attacks, deployments or parser failures. Fewer alerts do not automatically mean better quality.',
'استثنا را به app/version/path تأییدشده، hostهای مشخص و workflow محدود کن؛ کل SYSTEM یا PowerShell را حذف نکن. ticket، owner، expiry و دلیل بنویس. hash با update عوض می‌شود؛ مسیر معتبر هم قابل سوءاستفاده است.||Scope exceptions to verified app/version/path, hosts and workflows; do not exclude all SYSTEM/PowerShell. Require ticket, owner, expiry and rationale. Hashes change and trusted paths can be abused.',
'قبل/بعد volume، precision نمونه reviewشده و positive fixtureها را مقایسه کن. recall بدون مجموعه حملات واقعی یا آزمون معتبر denominator ندارد. تمرین: برای یک job مصوب استثنایی بنویس که نمونه مشکوک مشابه را همچنان بگیرد.||Compare volume, reviewed-sample precision and positive fixtures before/after. Recall requires a valid known-attack denominator. Practice a narrow approved-job exception that retains similar suspicious cases.'
],'کدام استثنا بهتر است؟||Which exception is better?',['همه ادمین‌ها||All administrators','workflow مشخص با owner و expiry||Specific workflow with owner/expiry'],1,'کم‌کردن noise نباید پوشش را کور کند.||Noise reduction must not erase coverage.',['slsass','escript']);
chapter('cloudlogs','cloud','دید امنیتی AWS و شکاف لاگ||AWS visibility and logging gaps',[
'control plane مثل IAM change با data plane مثل GetObject فرق دارد. روشن بودن trail تضمین ثبت همه data eventها نیست؛ selector، account و region را صریح مستند کن. AWS Config هم تاریخچه تنظیمات است، نه معادل کامل CloudTrail.||Control-plane IAM changes differ from data-plane object reads. Active trails do not guarantee all data events; document selectors/accounts/regions. AWS Config history is not a full CloudTrail substitute.',
'actor ARN را همراه identity type، session issuer و شناسه access key بررسی کن. assumed role ممکن است automation یا federation باشد؛ role name هویت انسانی نیست. secret را وارد گزارش نکن. خطای API را از موفقیت و وضعیت فعلی جدا کن.||Review ARN, identity type, session issuer and key identifier. Roles can originate in automation/federation and are not human identity. Exclude secrets from reports. Separate API errors, success and current state.',
'پس از restore، دریافت واقعی لاگ و selectors و destination/KMS access را تست کن. از منابع مستقل برای شکاف استفاده کن؛ درباره زمان بی‌دید صریح باش. حذف trail لزوماً حذف لاگ‌های تاریخی ذخیره‌شده نیست.||After restoration, verify actual delivery, selectors and destination/KMS access. Use independent sources for gaps and state unknown periods. Trail deletion need not delete stored historical logs.'
],'IsLogging=true یعنی همه GetObjectها ثبت می‌شوند؟||Does IsLogging=true mean all GetObject events are recorded?',['نه؛ data-event selectors را بررسی کن||No; inspect data-event selectors','بله||Yes'],0,'فعال‌بودن با پوشش کامل متفاوت است.||Active is not the same as complete coverage.',['estop','eselect','es3','econfig']);
chapter('entra','identity','تریاژ هویت در Entra ID||Entra identity triage',[
'audit تغییر config را از sign-in جدا کن. actor تغییر MFA ممکن است helpdesk یا app و target شخص دیگری باشد. correlation ID کمک می‌کند ولی همه eventهای یک incident الزاماً ID مشترک ندارند.||Separate configuration audit from sign-in. MFA-change actors may be helpdesk/apps with another target. Correlation IDs help, but incident events need not all share one.',
'MFA موفق پایان تحلیل نیست: method، device، app، session و فعالیت بعدی را ببین. geo anomaly می‌تواند VPN یا shared egress باشد؛ برای user از کانال مستقل تأیید بگیر و با شواهد نشست تطبیق بده.||Successful MFA does not finish triage: inspect method, device, app, session and later activity. VPN/shared egress can cause geo anomalies; verify independently and correlate sessions.',
'با IAM نشست‌ها، MFA methods، role و consentهای غیرمجاز را بررسی کن. password reset به‌تنهایی تمام tokenها یا app grants را حذف نمی‌کند. revoke و policy change باید با مجوز و ارزیابی اثر کسب‌وکار باشد.||With IAM inspect sessions, methods, roles and unauthorized consents. Password resets do not remove every token/app grant. Authorize revocation/policy changes and assess business impact.'
],'در MFA change چه کسی را بررسی کنیم؟||Whom should MFA-change triage examine?',['فقط target||Only target','actor و target و نشست‌های مرتبط||Actor, target and related sessions'],1,'اختلاط actor و target مسیر تصاحب را پنهان می‌کند.||Conflating actor/target can conceal takeover.',['emfa','edelegate']);
chapter('m365','identity','از mailbox rule تا BEC||Mailbox rules to BEC',[
'Inbox rule، mailbox forwarding و transport rule scope یکسان ندارند؛ آخری می‌تواند جریان سازمانی را تغییر دهد. action و پارامتر را با عنوان alert یکی نکن. FullAccess، SendAs و SendOnBehalf هم حق‌های متفاوت‌اند.||Inbox rules, mailbox forwarding and transport rules differ in scope; transport can affect organization-wide flow. Interpret actions/parameters, not just alert names. FullAccess/SendAs/SendOnBehalf differ.',
'ساخت rule یا دادن permission، دسترسی یا خروج واقعی را ثابت نمی‌کند. message trace و access/send logs موجود را بررسی و coverage gaps را ثبت کن. مقصد را parse و exact-match کن؛ evil-example.com متعلق به example.com نیست.||Rules/permissions do not prove access or transfer. Review available message trace/access/send logs and gaps. Parse and exact-match domains; evil-example.com is not example.com.',
'ورود، MFA change، delegation، forwarding و ارسال مالی را در timeline با evidence ID ثبت کن. response را با IAM، messaging و fraud هماهنگ کن. حذف rule تنها، session و persistenceهای دیگر را از بین نمی‌برد.||Build an evidence-linked timeline of sign-ins, MFA, delegation, forwarding and financial messages. Coordinate IAM/messaging/fraud response. Removing one rule does not eliminate sessions/other persistence.'
],'ساخت forwarding rule چه چیزی را ثابت می‌کند؟||What does forwarding-rule creation prove?',['config تغییر کرده؛ ارسال واقعی مدرک دیگری می‌خواهد||Configuration changed; actual transfer needs more evidence','همه ایمیل‌ها خارج شده‌اند||All mail was exfiltrated'],0,'configuration و data transfer دو مرحله‌اند.||Configuration and transfer are separate stages.',['eforward','edelegate','etransport']);
chapter('linuxaudit','linux','لینوکس: auditd، journal و FIM||Linux: auditd, journal and FIM',[
'FIM تغییر فایل را می‌بیند ولی همیشه process نویسنده ندارد. auditd می‌تواند effective UID، audit UID و EXECVE بدهد؛ چند record ممکن است یک event serial داشته باشند. journal برای unit execution و نشست مکمل است.||FIM observes file changes but may lack writers. auditd may supply effective UID, audit UID and EXECVE; multiple records can share one serial. Journal complements unit/session analysis.',
'root در container الزاماً همان اختیار host root را ندارد. host، container ID، namespace و mount را ثبت کن؛ path و clock را در context درست بخوان. sudoers و SSH را با effective policy و actual login پیوند بده.||Container root need not have host-root privileges. Record host, container ID, namespaces/mounts and interpret paths/clocks correctly. Link sudoers/SSH to effective policy and actual logins.',
'cron، systemd، profile و SSH را با diff، owner و writer بررسی کن؛ محتوا را اجرا نکن. پیش از اصلاح مجاز نسخه شواهد و permissionها را حفظ کن. تغییر یک فایل اثبات execution یا پاک‌شدن همه persistenceها نیست.||Inspect cron/systemd/profiles/SSH using diffs, owners and writers without executing content. Preserve evidence/permissions before authorized correction. One change proves neither execution nor removal of all persistence.'
],'هر FIM alert فرمان نویسنده را دارد؟||Does every FIM alert contain the writer command?',['خیر، telemetry مکمل ممکن است لازم باشد||No; complementary telemetry may be needed','بله||Yes'],0,'توان واقعی integration را از raw بررسی کن.||Validate actual integration capabilities from raw data.',['efim','ecron','eservice']);
chapter('networkdeep','network','شبکه فراتر از IP reputation||Network analysis beyond reputation',[
'src ممکن است NAT یا resolver باشد؛ bytes_out باید نسبت به endpoint تعریف شود. مجموع رفت‌وبرگشت را exfiltration ننام. DNS، TLS metadata و flow مکمل‌اند ولی محتوای session را الزاماً نشان نمی‌دهند.||src may be NAT/a resolver; define bytes_out relative to endpoints. Bidirectional totals are not exfiltration. DNS/TLS/flow complement each other without necessarily revealing session contents.',
'برای beacon تعداد gap معتبر، coefficient of variation و role دستگاه را ثبت کن. monitoring هم تناوب دارد؛ jitter، sampling و retry فاصله را عوض می‌کنند. این آمار برای اولویت‌بندی است، نه نسبت‌دادن قطعی به خانواده malware.||For beaconing record valid gaps, variation and device roles. Monitoring is periodic too; jitter, sampling and retries affect gaps. Statistics prioritize review, not definitive malware attribution.',
'IP، domain، process hash و user را با زمان ترکیب کن. reputation تاریخ‌دار و shared hosting چندمستأجری است. DNS محرمانه و URL دارای token را عمومی upload نکن؛ ابزار enrichment مصوب استفاده کن.||Combine IP/domain/process hash/user with time. Reputation is time-sensitive and hosting can be shared. Do not publicly upload sensitive DNS/token-bearing URLs; use approved enrichment.'
],'تناوب یک دقیقه‌ای قطعاً C2 است؟||Are one-minute connections definitely C2?',['نه؛ process، baseline و مقصد را بررسی کن||No; inspect process, baseline and destination','بله||Yes'],0,'healthcheck سالم هم چنین الگو دارد.||Legitimate health checks can show the same pattern.',['scobalt','sdns']);
chapter('evidence','foundation','حفظ شواهد و گزارش قابل دفاع||Evidence and defensible reporting',[
'مشاهده را از تفسیر جدا کن: «فرمان اجرا شد» با «credential دزدیده شد» فرق دارد. برای ادعا evidence ID، source، raw و timestamp داشته باش. inconclusive معتبر است اگر خلأ و اقدام بعدی روشن باشد.||Separate observation from inference: command execution differs from credential theft. Attach evidence IDs, source, raw data and time to claims. Inconclusive is valid with explicit gaps/next actions.',
'اصل را طبق سیاست با کنترل دسترسی حفظ، hash نسخه را ثبت و تبدیل‌ها را روی کپی انجام بده. hash اصالت منبع اولیه را به‌تنهایی ثابت نمی‌کند؛ custody دریافت، دسترسی و انتقال هم لازم است.||Preserve originals under access policy, hash copies and transform working copies. Hashes alone do not prove source authenticity; acquisition/access/transfer custody matters.',
'خلاصه، entity، بازه UTC، known/unknown، اثر کسب‌وکار، اقدام انجام‌شده، owner و next step را بنویس. query/version و نتیجه را نگه دار تا analyst بعدی بررسی را تکرار کند. داده محرمانه واقعی در این آکادمی وارد نکن.||Report summary, entities, UTC bounds, knowns/unknowns, business impact, completed actions, owner and next step. Preserve queries/versions/results for reproducibility. Do not enter real confidential data in this academy.'
],'SHA-256 به‌تنهایی اصالت منبع را ثابت می‌کند؟||Does SHA-256 alone establish source authenticity?',['خیر؛ integrity نسخه و custody جدا هستند||No; copy integrity and custody differ','بله||Yes'],0,'hash تغییر نسخه را می‌سنجد نه تمام provenance را.||Hashing addresses copy changes, not full provenance.',['cisa']);
chapter('ransomresponse','endpoint','پاسخ هماهنگ به باج‌افزار||Coordinated ransomware response',[
'با رمزگذاری محتمل فعال، مسیر اضطراری را فعال کن؛ برای تمام enrichmentها صبر نکن. host، سرویس حیاتی و backup درگیر را تعیین کن. isolation فقط مطابق اختیار ازپیش‌مصوب و ارزیابی اثر عملیاتی انجام شود.||Escalate plausible active encryption through emergency channels without waiting for all enrichment. Identify hosts, critical services and backups. Isolation requires preauthorized authority and impact assessment.',
'قطع شبکه با خاموش‌کردن متفاوت است؛ shutdown حافظه فرار را از دست می‌دهد. CISA اشاره می‌کند وقتی قطع ارتباط ممکن نیست خاموش‌کردن ممکن است برای توقف گسترش لازم شود؛ این trade-off را IR ارزیابی می‌کند.||Disconnection differs from shutdown, which loses volatile memory. CISA notes shutdown may be necessary when disconnection is impossible; IR assesses this trade-off.',
'restore از backup تست‌شده کافی نیست: مسیر ورود، credential، persistence و مدیریت backup را اصلاح کن. قبل reconnect، سلامت و monitoring را تأیید کن. گزارش‌دهی قانونی به حوزه قضایی و سیاست سازمان وابسته است.||Tested backup restoration is insufficient alone: fix entry paths, credentials, persistence and backup administration. Verify health/monitoring before reconnecting. Reporting obligations depend on jurisdiction/policy.'
],'برای ارجاع فعال رمزگذاری منتظر قطعیت کامل بمانیم؟||Wait for perfect certainty before escalating active encryption?',['بله||Yes','نه، response و preservation را هماهنگ کن||No; coordinate response and preservation'],1,'تأخیر می‌تواند خسارت را بیشتر کند.||Delay can increase harm.',['cisa']);
chapter('coverage','elastic','ماتریس پوشش و سلامت داده||Coverage and telemetry health',[
'برای هر behavior مشخص کن چه source/field آن را می‌بیند، چه چیزی inferred است و آخرین تست چه زمانی بوده. تعداد قانون و T-ID درصد پوشش همه حملات نیست. این پروژه inventory آموزشی است، نه کشف خودکار وضعیت سازمان.||Record observing sources/fields, inferred portions and last test for each behavior. Rule/T-ID counts are not all-attack coverage percentages. This is an educational inventory, not live environment discovery.',
'query روی hostهای دارای لاگ، host کاملاً ساکت را نمی‌یابد مگر expected inventory را مقایسه کنی. heartbeat، last event، lag و critical null fields را پایش کن. افت alert ممکن است افت telemetry باشد.||Queries over logged hosts cannot find fully silent hosts without expected inventory comparison. Monitor heartbeat, last event, lag and critical nulls. Fewer alerts may mean lost telemetry.',
'owner منبع، retention و integration version را ثبت کن. پس از parser، collection policy یا migration، تست مثبت و منفی را تکرار کن. در ماتریس این بسته وضعیت «آموزشی، اعتبارسنجی‌نشده در محیط» را با coverage واقعی اشتباه نگیر.||Record source owner, retention and integration version. Retest after parser/policy/migration changes. Do not mistake this package’s educational/unvalidated matrix for live coverage.'
],'برای یافتن host بی‌لاگ چه نیاز داریم؟||What is needed to find a host with no logs?',['inventory مورد انتظار علاوه بر داده موجود||Expected inventory plus observed data','فقط latest روی داده موجود||Only latest on observed data'],0,'موجودیت غایب ردیفی برای aggregate ندارد.||Absent entities have no rows to aggregate.',['sysmon','ststats']);
chapter('shift','foundation','تحویل شیفت و اولویت‌بندی||Shift handoff and prioritization',[
'vendor severity فقط یک ورودی است. فعال‌بودن رفتار، asset criticality، account privilege، scope و confidence را جدا ثبت کن. P1/P2 و SLA باید طبق سیاست SOC تعیین شوند؛ این بسته SLA عملیاتی تجویز نمی‌کند.||Vendor severity is one input. Record active behavior, asset criticality, account privilege, scope and confidence separately. Organizational policy defines P1/P2 and SLAs; this package prescribes none.',
'case باز، owner، آخرین اقدام/نتیجه، query قابل بازتولید، next step و زمان پیگیری را بنویس. «بررسی شد» کافی نیست؛ analyst بعدی باید بدون تکرار کار بداند کجا ادامه بدهد.||Record open case, owner, last action/result, reproducible query, next step and follow-up time. “Investigated” is insufficient; the next analyst should continue without repeating work.',
'برای کاهش صف، inconclusive را FP نکن. deadline تماس با مالک و تکمیل لاگ را ثبت و مسیر escalation را روشن کن. checkbox مدرک نیست؛ closing note باید دلیل و evidence link داشته باشد.||Do not relabel inconclusive cases as FP to shrink queues. Set owner/logging follow-up deadlines and escalation paths. Checkboxes are not evidence; closure requires rationale/evidence links.'
],'پرونده بی‌لاگ را برای کم‌کردن صف FP ببندیم؟||Close logless cases as FP to shrink the queue?',['بله||Yes','نه؛ inconclusive با owner و next step||No; inconclusive with owner/next step'],1,'نبود دید دلیل بی‌خطر بودن نیست.||No visibility is not proof of safety.',['cisa']);
chapter('privacy','foundation','حریم خصوصی و اعتبار منبع||Privacy and source provenance',[
'URL می‌تواند token یا شناسه پرونده داشته باشد. public sandbox ممکن است sample/result را منتشر کند؛ پیش از upload مجوز داده و سیاست سازمان را بررسی کن. hash-only lookup در ابزار مصوب را در نظر بگیر.||URLs can contain tokens/case identifiers. Public sandboxes may share samples/results; review permissions/policy before uploads. Consider approved hash-only lookups.',
'فقط داده لازم را گزارش کن؛ credential dump، secret یا session token ضمیمه عمومی نکن. redact روی نسخه کاری و با ثبت تبدیل باشد، اصل محدود طبق retention حفظ شود. سوپرادمین آکادمی یادداشت‌های تمرینی اعضا را می‌بیند.||Report only necessary data; never publicly attach credential dumps, secrets or tokens. Document working-copy redaction and retain restricted originals under policy. Academy superadmins can see member training notes.',
'صفحه رسمی vendor مرجع است، نه مهر تأیید پروژه. تاریخ مطالعه و نوع استفاده مانند behavior context یا syntax را ثبت کن. queryها و توضیحات این نسخه تألیفی‌اند و Splunk یا Elastic آن‌ها را certify نکرده‌اند؛ نسخه نصب‌شده و تست واقعی لازم است.||Official vendor pages are references, not endorsements. Record review date and use such as behavior context/syntax. These authored queries/explanations are not vendor-certified; installed-version validation and live testing are required.'
],'منبع رسمی یعنی query پروژه certified است؟||Does an official source certify academy queries?',['نه، منشأ با تست اجرا فرق دارد||No; provenance differs from execution validation','بله||Yes'],0,'منبع معتبر جای تست محیط هدف را نمی‌گیرد.||Reliable references do not replace target-environment testing.',['edownload','cisa']);
const moreGloss=[
['ECS','قرارداد فیلد Elastic؛ صحت mapping نیازمند تست است.||Elastic field schema; mappings require validation.'],['KQL (Kibana)','فیلتر سند؛ با Microsoft Kusto متفاوت است.||Document filtering, distinct from Microsoft Kusto.'],['EQL','الگوی رویداد و توالی با join و زمان معتبر.||Event patterns/sequences with valid joins and time.'],['ES|QL','pipeline تحلیلی Elasticsearch.||Elasticsearch analytical pipelines.'],['Look-back','بازه داده جست‌وجوشده در هر run، نه فاصله run.||Data window searched per run, not schedule interval.'],['Maxspan','حداکثر فاصله اولین و آخرین event توالی.||Maximum time between first/last sequence events.'],['Ingestion lag','تأخیر وقوع تا ingestion؛ تحت تأثیر clock/parser.||Occurrence-to-ingestion delay, affected by clocks/parsers.'],['Event time','زمان رخداد منبع، نه زمان دریافت یا index.||Source event time, not reception/index time.'],['Process entity ID','شناسه قابل پیوند process، مقاوم‌تر از PID تنها به reuse.||Correlatable process identity, safer than PID under reuse.'],['SACL','تنظیم audit دسترسی object در Windows.||Windows object-access auditing configuration.'],['FIM','پایش تغییر فایل؛ writer ممکن است ثبت نشده باشد.||File-change monitoring; writer may be absent.'],['Audit UID','هویت آغازگر نشست در Linux audit، نه لزوماً effective UID.||Linux audit session-origin identity, not necessarily effective UID.'],['CloudTrail','ثبت APIهای AWS با پوشش وابسته به selector.||AWS API recording with selector-dependent coverage.'],['Management event','رویداد control plane مانند تغییر تنظیمات.||Control-plane event such as configuration changes.'],['Data event','فعالیت data plane مانند خواندن object؛ پیکربندی لازم است.||Data-plane activity such as object reads; configuration required.'],['Assumed role','هویت موقت نقش؛ session issuer و origin را بررسی کن.||Temporary role identity; inspect session issuer/origin.'],['Conditional Access','سیاست context-based، متفاوت از per-user MFA.||Context-based policy, distinct from per-user MFA.'],['Suppression','محدودکردن هشدار تکراری که می‌تواند فعالیت تازه را پنهان کند.||Duplicate-alert reduction that may conceal new activity.'],['Exception expiry','تاریخ بازبینی/پایان استثنا.||Exception review/end date.'],['Precision','سهم positive درست از positiveهای reviewشده طبق taxonomy مشخص.||Correct positives over reviewed positives under a defined taxonomy.'],['Recall','کشف‌شده از مجموعه حملات واقعی/شناخته‌شده؛ denominator معتبر لازم است.||Detected attacks over a valid known/actual attack denominator.'],['Detection drift','تغییر کیفیت قانون پس از تغییر محیط، parser یا رفتار تهدید.||Rule-quality drift after environment/parser/adversary changes.'],['Shadow mode','اجرای آزمایشی بدون اقدام خودکار عملیاتی.||Trial execution without automated operational response.'],['Custody record','سوابق زمان‌دار دریافت، دسترسی و انتقال شواهد.||Timed evidence acquisition/access/transfer records.'],['Volatile evidence','شواهدی مثل memory که با shutdown از دست می‌رود.||Evidence such as memory lost on shutdown.'],['Blast radius','دامنه بالقوه اثر روی asset، identity و service.||Potential impact across assets, identities and services.'],['Risk score','امتیاز اولویت، نه احتمال آماری بدون calibration.||Prioritization score, not an uncalibrated probability.'],['B-TP','رفتار درست تشخیص‌داده‌شده ولی مجاز با شواهد workflow.||Correctly detected authorized behavior with workflow evidence.']
];glossary.push(...moreGloss.map(([k,v])=>[k,bi(v)]));

const refSection=ids=>`<section class="reference-section"><h2>${text('منابع رسمی و منشأ محتوا','Official references & provenance')}</h2><p class="small muted">${text('توضیحات و کوئری‌ها تألیفی و آموزشی‌اند، نه تأییدشده توسط فروشنده. نوع استفاده از هر منبع زیر آمده است. تاریخ بررسی منابع: ۲۰۲۶/۰۹/۰۸.','Explanations and queries are authored education, not vendor-certified. Reference purposes are listed below. Sources reviewed: 2026-09-08.')}</p>${(ids||[]).map(id=>{const r=SR[id];return r?`<div class="source-entry"><a href="${E(r.url)}" target="_blank" rel="noopener noreferrer">${E(r.name)} ↗</a><p class="small muted">${E(t(r.scope))}</p></div>`:''}).join('')}</section>`;
function queryBox(q,label){return `<div class="code-box"><div class="code-head"><span>${E(label)} / AUTHORED TRIAGE</span><button onclick="copyCode(this)">${text('کپی متن','Copy text')}</button></div><pre><code>${E(q)}</code></pre></div>`}
function qPanel(p){return `<section id="query-area"><h2>${text('جست‌وجوی بررسی، نه قانون آماده نصب','Investigation queries, not installable rules')}</h2><div class="tabs" role="tablist" aria-label="Query language"><button id="q-spl" role="tab" aria-controls="q-body" aria-selected="true" class="active" onclick="switchQuery('${p.id}','spl')">Splunk SPL</button><button id="q-elastic" role="tab" aria-controls="q-body" aria-selected="false" onclick="switchQuery('${p.id}','elastic')">Elastic ${E(p.language)}</button></div><div id="q-body" role="tabpanel">${queryBox(p.query,'SPL')}<p class="small muted">${E(t(rawContract))}</p></div></section>`}
function switchQuery(id,lang){const p=playbooks.find(p=>p.id===id);document.getElementById('q-body').innerHTML=queryBox(lang==='spl'?p.query:p.elastic,lang==='spl'?'SPL':p.language)+`<p class="small muted">${E(t(lang==='spl'?rawContract:ecsContract))}</p>`;['spl','elastic'].forEach(k=>{const b=document.getElementById('q-'+k);b.classList.toggle('active',k===lang);b.setAttribute('aria-selected',String(k===lang))})}
const savedBooks=()=>{const v=store.get('erm-saved-books',[]);return Array.isArray(v)?v.filter(id=>playbooks.some(p=>p.id===id)):[]};
function bookmark(id,b){let a=savedBooks();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];store.set('erm-saved-books',a);b.textContent=a.includes(id)?text('★ نشان‌شده','★ Saved'):text('☆ نشان کردن','☆ Save');b.setAttribute('aria-pressed',String(a.includes(id)));toast(text('نشان فقط در این مرورگر ذخیره شد.','Bookmark stored in this browser only.'))}
Object.assign(state,{bookCat:'all',bookSeverity:'all',bookSearch:'',onlySaved:false});
const normalizeSearch=s=>String(s).toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').trim();
function filterBooks(){let q=normalizeSearch(state.bookSearch);return playbooks.filter(p=>(state.bookCat==='all'||p.cat===state.bookCat)&&(state.bookSeverity==='all'||p.severity===state.bookSeverity)&&(!state.onlySaved||savedBooks().includes(p.id))&&normalizeSearch(JSON.stringify(p)).includes(q))}
function bookResults(){const a=filterBooks();return `<p class="small muted" role="status">${a.length} / ${playbooks.length} ${text('راهنما','playbooks')}</p>${a.length?bookTable(a):`<div class="empty">${text('نتیجه‌ای نیست؛ عبارت کوتاه‌تر، دسته دیگر یا حذف فیلتر نشان‌شده را امتحان کن.','No matches. Try a shorter query, another category or turn off saved-only.')}</div>`}`}

books=function(){return `${title(text('کتابخانهٔ بررسی هشدار','Investigation library'),text('از سیگنال شروع کن؛ با شواهد تصمیم بگیر. هر راهنما: داده، بررسی، محدودیت، SPL، Elastic و منبع.','Start with a signal. Decide with evidence. Telemetry, triage, gaps, SPL, Elastic and references.'))}<div class="library-intro"><p>${text('۴۰ سناریوی آموزشی، از پردازش Windows تا لاگ AWS. شدت‌ها نمونه‌اند؛ هیچ اتصال زنده، اجرای کوئری یا بستن هشدار واقعی انجام نمی‌شود.','40 training scenarios, from Windows processes to AWS logging. Severities are illustrative; no live connection, query execution or real alert closure occurs.')}</p><button onclick="exportCatalog()">${text('دانلود کاتالوگ JSON','Download JSON catalog')}</button></div><div class="library-filters"><div><label for="book-search">${text('جست‌وجوی هشدار، تکنیک یا فیلد','Search alert, technique or field')}</label><input id="book-search" value="${E(state.bookSearch)}" placeholder="PowerShell / T1562 / MFA" oninput="updateBookFilter('bookSearch',this.value)"></div><div><label for="book-cat">${text('حوزه','Domain')}</label><select id="book-cat" onchange="updateBookFilter('bookCat',this.value)">${['all','endpoint','linux','network','identity','cloud'].map(k=>`<option value="${k}" ${state.bookCat===k?'selected':''}>${E(t(categories[k]))}</option>`).join('')}</select></div><div><label for="book-severity">${text('شدت آموزشی','Teaching severity')}</label><select id="book-severity" onchange="updateBookFilter('bookSeverity',this.value)">${[['all',text('همه','All')],['high',text('بالا','High')],['medium',text('متوسط','Medium')]].map(([k,v])=>`<option value="${k}" ${state.bookSeverity===k?'selected':''}>${v}</option>`).join('')}</select></div><label class="check"><input type="checkbox" ${state.onlySaved?'checked':''} onchange="updateBookFilter('onlySaved',this.checked)">${text('فقط نشان‌شده‌ها','Saved only')}</label></div><div id="book-results">${bookResults()}</div>${footer()}`};
const originalBook=book;
book=function(){const p=playbooks.find(x=>x.id===state.playbook)||playbooks[0];let html=originalBook();html=html.replace(codeBox(p.query),qPanel(p));html=html.replace('</article>',`<section><h2>${text('نقطه‌های کور و حد ادعا','Blind spots and limits')}</h2><p>${E(t(p.blind))}</p></section><section><h2>${text('تنظیم و اعتبارسنجی قبل از عملیات','Tuning and validation before operations')}</h2><p>${text('نمونه مثبت، منفی و فعالیت مجاز بساز؛ با فیلد گمشده، داده دیررس، duplicate و مرز پنجره تکرار کن. استثنا فقط با owner، ticket، دامنه محدود و expiry؛ هیچ index یا عدد این نمونه را بدون تطبیق کپی نکن.','Test positive, negative and authorized behavior; repeat with missing fields, late arrivals, duplicates and window boundaries. Exceptions require owner, ticket, narrow scope and expiry. Never copy example indexes or thresholds without adapting them.')}</p></section>${refSection(p.sourceIds)}<div class="row wrap"><button aria-pressed="${savedBooks().includes(p.id)}" onclick="bookmark('${p.id}',this)">${savedBooks().includes(p.id)?text('★ نشان‌شده','★ Saved'):text('☆ نشان کردن','☆ Save')}</button><button onclick="exportPlaybook('${p.id}')">${text('دانلود راهنمای کامل','Download full playbook')}</button><button onclick="window.print()">${text('چاپ / PDF','Print / PDF')}</button></div></article>`);html=html.replace('<label for="notes">',`<button class="plain" onclick="noteTemplate()">${text('افزودن قالب گزارش به یادداشت','Append report template')}</button><label for="notes">`);return html};

eep TP/FP/FN definitions consistent. FN is only meaningful with a validated known-attack set; leave it blank if unknown. Document BTP under organizational taxonomy.')}</p><div class="metric-inputs"><div><label for="tp">TP</label><input id="tp" type="number" min="0" step="1" oninput="qualityCalc()"></div><div><label for="fp">FP</label><input id="fp" type="number" min="0" step="1" oninput="qualityCalc()"></div><div><label for="fn">FN (${text('اختیاری','optional')})</label><input id="fn" type="number" min="0" step="1" oninput="qualityCalc()"></div></div><p id="quality-output" role="status" class="notice">${text('TP و FP را وارد کن.','Enter TP and FP.')}</p></section><section><h2>${text('۴. قالب تحویل شیفت','4. Shift handoff template')}</h2><p>${text('برای هر پرونده، مالک و گام بعدی و زمان پیگیری را ثبت کن. قالب را دانلود یا در یادداشت هر راهنما استفاده کن.','Record owner, next action and follow-up time for each case. Download this template or use the worksheet inside a playbook.')}</p><button onclick="handoffTemplate()">${text('دانلود قالب Markdown','Download Markdown template')}</button></section>${refSection(['ekql','eeql','ststats','sysmon','cisa'])}</article>${footer()}`}
function qualityCalc(){let read=id=>document.getElementById(id).value.trim(),a=read('tp'),b=read('fp'),c=read('fn'),out=document.getElementById('quality-output');if([a,b].some(v=>v==='')){out.textContent=text('TP و FP را وارد کن.','Enter TP and FP.');return}let vals=[a,b,...(c!==''?[c]:[])].map(Number);if(vals.some(v=>!Number.isSafeInteger(v)||v<0)){out.textContent=text('فقط عدد صحیح نامنفی و معتبر وارد کن.','Enter valid non-negative integers.');return}let tp=+a,fp=+b,fn=c===''?null:+c;out.textContent=`Precision: ${tp+fp?(100*tp/(tp+fp)).toFixed(1)+'%':text('تعریف‌نشده (مخرج صفر)','undefined (zero denominator)')} | Recall: ${fn===null?text('نامعلوم','unknown'):tp+fn?(100*tp/(tp+fn)).toFixed(1)+'%':text('تعریف‌نشده (مخرج صفر)','undefined (zero denominator)')}`}

ای vendor کپی نشده‌اند. برای استفاده از قانون اصلی، صفحه منبع، license و نسخه آن را بررسی کن. تاریخ بررسی منابع ۲۰۲۶/۰۹/۰۸ است.','New material is independently authored education; full vendor rules and exception sets were not copied. For original rules, review source pages, licenses and versions. Sources reviewed on 2026-09-08.')}</p><button onclick="download('sources-v2.json',JSON.stringify(SR,null,2),'application/json')">${text('دانلود شناسنامه منابع','Download source registry')}</button></section>${refSection(Object.keys(SR))}</article>${footer()}`};
